  crit:Math.min(0.9,0.05+st.dex*0.006+(sm.crit||0)+(m.crit||0)+wOpt('crit')),

/* ===================== 13. 물리 (플레이어·적 공용) ===================== */
function physics(o,noGrav){
 if(!noGrav)o.vy=Math.min(o.vy+GRAV,18);
 o.x+=o.vx;o.x=clamp(o.x,0,G.roomW-o.w);
 const prevB=o.y+o.h;o.y+=o.vy;o.ground=false;o.onPlat=false;
 if(o.vy>=0){for(const p of plats){
  if(o.x+o.w<=p.x||o.x>=p.x+p.w)continue;
  if(p.oneway&&o.dropT>0)continue;
  if(prevB<=p.y+1&&o.y+o.h>=p.y){o.y=p.y-o.h;o.vy=0;o.ground=true;o.onPlat=!!p.oneway;break;}
 }}
 if(o.y+o.h>FLOOR){o.y=FLOOR-o.h;o.vy=0;o.ground=true;o.onPlat=false;}
}

 const kb=(o.kb===undefined?3:o.kb)*(e.heavy||e.boss?0.3:1);
 if(e.ai!=='dummy'){e.vx=dir*kb;if(kb>4&&!e.fly&&!e.boss)e.vy=-kb*0.5;if(!e.boss)e.stagger=Math.max(e.stagger||0,o.stagger||10);}

 if(o.burn)e.burn=Math.max(e.burn||0,o.burn);
 addNum(cxOf(e),e.y-6,dmg,capped?'#ffb08a':crit?'#ffd34d':'#ffffff',crit);

 if(G.mode==='training'){const d=G.dps;if(!d.start||G.t-d.last>180){d.sum=0;d.start=G.t;}d.sum+=dmg;d.last=G.t;}

 }

/* ===================== 22. 던전 생성 (BFS 연결 검증) ===================== */
function genFloor(seed,nRooms){
 const R=mulberry(seed),rooms=[],grid={},key=(x,y)=>x+','+y;
 const add=(gx,gy)=>{const r={id:rooms.length,gx,gy,type:'combat',doors:{},cleared:false,visited:false,looted:false,seed:Math.floor(R()*1e9)};rooms.push(r);grid[key(gx,gy)]=r;return r;};
 add(0,0);
 const dirs=[[1,0,'r','l'],[-1,0,'l','r'],[0,-1,'u','d'],[0,1,'d','u']];
 let guard=0;
 while(rooms.length<nRooms&&guard++<800){
  const base=rooms[Math.floor(R()*rooms.length)];
  const d=R()<0.7?(R()<0.75?dirs[0]:dirs[1]):dirs[2+Math.floor(R()*2)];
  const nx=base.gx+d[0],ny=base.gy+d[1];
  if(Math.abs(ny)>2||nx<-2||grid[key(nx,ny)])continue;
  const n=add(nx,ny);base.doors[d[2]]=n.id;n.doors[d[3]]=base.id;
 }
 const dA=rooms.map(()=>-1);dA[0]=0;const q=[0];
 while(q.length){const c=q.shift();for(const k in rooms[c].doors){const t=rooms[c].doors[k];if(dA[t]<0){dA[t]=dA[c]+1;q.push(t);}}}
 rooms.forEach((r,i)=>r.dist=dA[i]);
 if(rooms.some(r=>r.dist<0))return genFloor(seed+1,nRooms);
 rooms[0].type='start';rooms[0].cleared=true;
 const order=rooms.slice(1).sort((a,b)=>b.dist-a.dist);
 const boss=order.find(r=>Object.keys(r.doors).length===1)||order[0];boss.type='boss';
 const rest=order.filter(r=>r!==boss);
 for(let i=rest.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
 if(rest[0])rest[0].type='treasure';
 if(rest[1])rest[1].type='shrine';
 let el=nRooms>7?2:1;
 for(const r of rest.slice(2))if(el>0&&r.dist>=2){r.type='elite';el--;}
 for(const r of rooms)if(r.type==='treasure'||r.type==='shrine')r.cleared=true;
 return rooms;
}
function buildRoom(r){
 const R=mulberry(r.seed);
 G.roomW=['boss','start','treasure','shrine'].includes(r.type)?W:(R()<0.55?1440:1200);
 const RW=G.roomW,T1=FLOOR-112,T2=FLOOR-205,T3=FLOOR-298,mid=RW/2;
 const hasU=r.doors.u!==undefined,hasD=r.doors.d!==undefined;
 plats=[{x:0,y:FLOOR,w:RW,h:H-FLOOR,oneway:false}];doors=[];props=[];
 if(r.type==='boss'){plats.push({x:120,y:T1,w:160,h:14,oneway:true},{x:RW-280,y:T1,w:160,h:14,oneway:true},{x:mid-90,y:T2,w:180,h:14,oneway:true});}
 else{let x=110+R()*60,i=0;while(x<RW-220){const w=130+R()*80;if(!(hasU&&Math.abs(x+w/2-mid)<240)){plats.push({x,y:T1,w,h:14,oneway:true});if(i%2===1&&R()<0.7)plats.push({x:x+60,y:T2,w:120+R()*50,h:14,oneway:true});}x+=w+110+R()*120;i++;}}
 if(hasU){plats.push({x:mid-230,y:T1,w:130,h:14,oneway:true},{x:mid+100,y:T2,w:130,h:14,oneway:true},{x:mid-90,y:T3,w:180,h:14,oneway:true});doors.push({x:mid-24,y:T3-76,w:48,h:76,dir:'u',to:r.doors.u});}
 if(hasD)doors.push({x:mid-24,y:FLOOR-76,w:48,h:76,dir:'d',to:r.doors.d});
 if(r.doors.l!==undefined)doors.push({x:0,y:FLOOR-96,w:34,h:96,dir:'l',to:r.doors.l});
 if(r.doors.r!==undefined)doors.push({x:RW-34,y:FLOOR-96,w:34,h:96,dir:'r',to:r.doors.r});
 const px=mid+(hasD?140:0);
 if(r.type==='treasure')props.push({kind:'chest',x:px-24,y:FLOOR-34,w:48,h:34,used:r.looted});
 if(r.type==='ruin'&&r.cleared)props.push({kind:'rchest',x:px-24,y:FLOOR-34,w:48,h:34,used:r.looted});if(r.type==='shrine')props.push({kind:'shrine',x:px-26,y:FLOOR-90,w:52,h:90,used:r.looted});
}

/* ===================== 25. 적 AI ===================== */
function eFront(e,w,h){return{x:e.face>0?cxOf(e)-10:cxOf(e)+10-w,y:e.y+e.h-h,w,h};}
function eHit(e,box,mult){e.sw=10;if(ov(box,P))hurtPlayer(e.atk*(mult||1),e);}
function eSlashFx(e,r,col){addFx({kind:'eslash',x:cxOf(e),y:cyOf(e),face:e.face,r,col:col||'#ff6060',life:10});}
function updateEnemy(e){
 if(e.ai==='rival'){updateRival(e);return;}
 e.anim++;if(e.flash>0)e.flash--;if(e.sw>0)e.sw--;
 if(e.burn>0){e.burn--;if(e.burn%30===0){let d=Math.max(1,Math.round(P.st.atk*0.25));if(e.boss)d=bossGate(e,d);e.hp-=d;addNum(cxOf(e),e.y-4,d,'#ff9a3c');burst(cxOf(e),cyOf(e),'#ff8a3c',3,2,{up:1});
  if(e.ai==='dummy')e.hp=e.maxHp;else if(e.hp<=0){killEnemy(e);return;}}}
 if(e.boss){updateBoss(e);return;}
 const move=()=>{if(e.fly){e.x=clamp(e.x+e.vx,0,G.roomW-e.w);e.y=clamp(e.y+e.vy,40,FLOOR-e.h);}else physics(e);};
 if(e.ai==='dummy'){e.vx*=0.8;physics(e);return;}
 if(e.stun>0){e.stun--;e.st='idle';e.vx*=0.85;if(e.fly)e.vy*=0.85;move();return;}
 if(e.stagger>0&&!(e.heavy&&e.st==='wind')){e.stagger--;if(e.st!=='dive')e.st='idle';e.vx*=0.85;move();return;}
 e.stagger=0;
 const dx=cxOf(P)-cxOf(e),adx=Math.abs(dx),sg=Math.sign(dx)||1;
 if(e.cd>0)e.cd--;
 if(P.dead){e.vx*=0.8;move();return;}
 switch(e.ai){
  case'slime':
   if(e.ground){e.vx*=0.8;if(e.cd<=0){e.vy=-rand(7,10);e.vx=sg*e.spd*rand(1.2,1.8);e.cd=randi(50,90);e.face=sg;}}
   break;
  case'melee':case'sparring':
   if(e.st==='wind'){e.vx*=0.7;if(--e.t<=0){eHit(e,eFront(e,74,66));sfx('slash');eSlashFx(e,58,e.D.blade&&e.D.blade.glow);e.st='rec';e.t=22;e.cd=randi(70,120);}}
   else if(e.st==='rec'){e.vx*=0.8;if(--e.t<=0)e.st='idle';}
   else{e.face=sg;if(e.ai==='melee'&&adx>56)e.vx=sg*e.spd;else e.vx*=0.7;if(adx<(e.ai==='sparring'?130:84)&&e.cd<=0){e.st='wind';e.t=e.D.wind||30;}}
   break;
  case'ranged':
   if(e.st==='wind'){e.vx*=0.7;if(--e.t<=0){shoot({friend:false,kind:'arrow',x:cxOf(e)+e.face*14-11,y:e.y+16,w:22,h:6,vx:e.face*7.5,life:120,dmg:e.atk,col:'#e0d0a0'});sfx('shoot');e.st='idle';e.cd=randi(90,140);}}
   else{e.face=sg;if(adx<220)e.vx=-sg*e.spd;else if(adx>420)e.vx=sg*e.spd;else e.vx*=0.8;if(e.cd<=0&&adx<560&&Math.abs(cyOf(P)-cyOf(e))<70){e.st='wind';e.t=30;}}
   break;
  case'flyer':
   if(e.st==='dive'){if(--e.t<=0){e.st='idle';e.cd=randi(60,100);}}
   else{const tx=cxOf(P)-sg*120,ty=P.y-110;e.vx+=(Math.sign(tx-cxOf(e))*e.spd-e.vx)*0.05;e.vy+=(Math.sign(ty-e.y)*e.spd*0.7-e.vy)*0.05+Math.sin(e.anim*0.12)*0.15;e.face=sg;
    if(e.cd<=0&&adx<300){const a=Math.atan2(cyOf(P)-cyOf(e),dx);e.vx=Math.cos(a)*7;e.vy=Math.sin(a)*7;e.st='dive';e.t=36;}}
   break;
  case'brute':
   if(e.st==='wind'){e.vx*=0.6;if(--e.t<=0){eHit(e,eFront(e,124,92),1.2);shake(8);sfx('boom');
     shoot({friend:false,kind:'shock',x:cxOf(e)+e.face*40-20,y:FLOOR-26,w:40,h:26,vx:e.face*6,life:50,dmg:e.atk*0.7,persist:true,cuttable:false,isProj:false,col:'#ff8a5c'});
     burst(cxOf(e)+e.face*60,FLOOR,'#aa8866',12,4,{up:2});e.st='rec';e.t=40;e.cd=randi(100,150);}}
   else if(e.st==='rec'){e.vx*=0.8;if(--e.t<=0)e.st='idle';}
   else{e.face=sg;e.vx=adx>90?sg*e.spd:e.vx*0.7;if(adx<130&&e.cd<=0){e.st='wind';e.t=46;}}
   break;
  case'caster':
   if(e.st==='wind'){e.vx*=0.7;if(--e.t<=0){const a=Math.atan2(cyOf(P)-(e.y+19),dx);shoot({friend:false,kind:'orb',x:cxOf(e)-9,y:e.y+10,w:18,h:18,vx:Math.cos(a)*5,vy:Math.sin(a)*5,life:150,dmg:e.atk,col:'#ff4df0'});sfx('shoot');e.st='idle';e.cd=randi(90,130);}}
   else if(e.st==='tpw'){e.vx*=0.6;if(e.t%6===0)burst(cxOf(e),cyOf(e),'#ff4df0',3,2,{g:0});
    if(--e.t<=0){burst(cxOf(e),cyOf(e),'#ff4df0',12,3,{g:0});e.x=spawnX(220)-e.w/2;burst(cxOf(e),cyOf(e),'#ff4df0',12,3,{g:0});
     e.st='idle';e.tp=randi(360,480);e.tpCd=240;e.cd=Math.max(e.cd,40);}}
   else{e.face=sg;e.vx*=0.8;e.tp=(e.tp===undefined?randi(300,420):e.tp)-1;e.tpCd=Math.max(0,(e.tpCd||0)-1);
    if(e.tpCd<=0&&(e.tp<=0||adx<90)){e.st='tpw';e.t=36;}
    else if(e.cd<=0&&adx<600){e.st='wind';e.t=34;}}
   break;
 }
 if(e.D.contact&&ov(e,P))hurtPlayer(e.atk*0.8,e);
 move();
}
function bossDone(e,sp){e.st='idle';e.tele=0;e.hide=false;e.landed=false;e.cd=Math.round(rand(45,75)/sp);e.t=0;}
function updateBoss(e){
 const B=e.B,dx=cxOf(P)-cxOf(e),adx=Math.abs(dx),sg=Math.sign(dx)||1;
 /* 페이즈 전환: HP 70% · 30% 도달 시 강제 무적 + 밀쳐내기 충격파 후 패턴 강화 */
 if(e.pendingPhase&&e.st!=='phase'){e.pendingPhase=false;e.phase++;e.phase2=true;e.st='phase';e.t=0;e.tele=0;e.hide=false;e.stun=0;e.vx=0;}
 const sp=1+e.phase*0.18;e.invulnT=(e.hide||e.st==='phase')?2:0;
 if(e.idx===4&&e.anim%46===0)addFx({kind:'ring',x:cxOf(e),y:cyOf(e),r:10,max:110,col:e.anim%92?'#ffffff':'#ff2040',life:30,soft:true});
 if(e.stun>0&&e.st!=='phase'){e.stun--;if(e.st!=='idle')bossDone(e,sp);e.vx*=0.8;physics(e);return;}
 if(P.dead){e.vx*=0.8;physics(e);return;}
 e.t++;bossTelegraph(e);
 const col=B.blade?(B.blade.glow||B.blade.col):'#ff8a5c';
 switch(e.st){
  case'idle':
   e.face=sg;e.vx=adx>140?sg*e.spd*sp:e.vx*0.8;
   if(--e.cd<=0){e.st=e.phase>=2&&e.pi%3===2?'nova':B.patterns[e.pi%B.patterns.length];e.pi++;e.t=0;}
   break;
  case'phase':
   e.vx=0;
   if(e.t===1){shake(10);sfx('ult');G.flash={col:'#ff3040',t:10};addFx({kind:'banner',txt:`${e.name} — ${e.phase===1?'2페이즈 · 각성':'최종 페이즈 · 폭주'}`,col:'#ff3040',life:100});}
   if(e.t<34&&e.t%3===0)burst(cxOf(e),cyOf(e),'#ff3040',6,4,{g:0,add:true});
   if(e.t===34){sfx('boom');shake(16);G.distort=Math.max(G.distort,12);
    addFx({kind:'ring',x:cxOf(e),y:cyOf(e),r:20,max:560,col:'#ff3040',life:30});addFx({kind:'ring',x:cxOf(e),y:cyOf(e),r:10,max:380,col:'#ffffff',life:22});
    const dir=cxOf(P)>=cxOf(e)?1:-1,ad=Math.abs(cxOf(P)-cxOf(e));
    if(ad<170)hurtPlayer(e.atk*0.6,e);
    if(ad<560&&!P.dead){cancelAttack();P.plunge=false;P.dodgeT=0;P.vx=dir*15;P.vy=-7;}}
   if(e.t>=72){bossDone(e,sp);e.cd=24;}
   break;
  case'nova':
   e.vx*=0.8;e.tele=e.t<36?1:0;
   if(e.t===36||e.t===64){const n=14,off=e.t===64?Math.PI/n:0;for(let i=0;i<n;i++){const a=i/n*6.283+off;shoot({friend:false,kind:'orb',x:cxOf(e)-9,y:cyOf(e)-9,w:18,h:18,vx:Math.cos(a)*4.2,vy:Math.sin(a)*4.2,life:140,dmg:e.atk*0.6,col:'#ff3040'});}addFx({kind:'ring',x:cxOf(e),y:cyOf(e),r:10,max:140,col:'#ff3040',life:16});sfx('boom');shake(6);}
   if(e.t>=104)bossDone(e,sp);
   break;
  case'combo':{const n=3+e.phase,per=Math.round(26/sp),w0=26;
   if(e.t<w0){e.tele=1;e.face=sg;e.vx=sg*e.spd*1.6;}
   else{e.tele=0;const k=(e.t-w0)/per;
    if(Number.isInteger(k)&&k<n){e.face=sg;e.vx=sg*7;eHit(e,eFront(e,140,110));sfx('slash');eSlashFx(e,90,col);}else e.vx*=0.8;
    if(e.t>=w0+n*per+20)bossDone(e,sp);}
   break;}
  case'dash':
   if(e.t<36){e.tele=1;e.vx*=0.8;e.face=sg;}
   else if(e.t<66){e.tele=0;e.vx=e.face*15*sp;if(ov(e,P))hurtPlayer(e.atk*1.1,e);if(e.t%2)burst(cxOf(e),e.y+e.h-6,'#cccccc',2,2);}
   else{e.vx*=0.8;if(e.t>86)bossDone(e,sp);}
   break;
  case'slam':
   if(e.t===1){e.vy=-15;e.vx=clamp(((e.slamX||cxOf(P))-cxOf(e))/54,-9,9);e.face=sg;e.tele=1;}
   if(e.t>2&&e.ground&&!e.landed){e.landed=true;e.tele=0;e.vx=0;shake(14);sfx('boom');
    for(const f of[1,-1])shoot({friend:false,kind:'shock',x:cxOf(e)+f*30-20,y:FLOOR-28,w:40,h:28,vx:f*7*sp,life:60,dmg:e.atk*0.8,persist:true,cuttable:false,isProj:false,col:'#ff8a5c'});
    if(ov({x:e.x-60,y:e.y,w:e.w+120,h:e.h},P))hurtPlayer(e.atk*1.2,e);burst(cxOf(e),FLOOR,'#aa8866',20,5,{up:3});}
   if(e.t>=90)bossDone(e,sp);
   break;
  case'summon':
   e.vx*=0.8;if(e.t<40)e.tele=1;
   if(e.t===40){e.tele=0;if(enemies.filter(x=>!x.dead&&!x.boss).length<4)for(let i=0;i<2;i++)spawnEnemy(B.summon||'skeleton',e.sumX?e.sumX[i]:clamp(cxOf(e)+(i?-1:1)*rand(120,220),60,G.roomW-60));sfx('skill');}
   if(e.t>=70)bossDone(e,sp);
   break;
  case'rain':
   e.vx*=0.8;
   if(e.t%(e.phase2?8:12)===0&&e.t<=80){const tx=clamp(cxOf(P)+rand(-160,160),20,G.roomW-20);shoot({friend:false,kind:'rock',x:tx-14,y:-40,w:28,h:28,grav:0.35,life:200,dmg:e.atk*0.8,col:B.golem?'#d1663a':'#b77dff',delay:30,warnX:tx});}
   if(e.t>=110)bossDone(e,sp);
   break;
  case'pillars':
   e.vx*=0.8;
   if(e.t===1){e.tele=1;const n=e.phase2?7:5;for(let i=0;i<n;i++){const px=i===0?cxOf(P):rand(40,G.roomW-40);shoot({friend:false,kind:'pillar',x:px-22,y:0,w:44,h:FLOOR,life:22,delay:44+i*6,dmg:e.atk*1.1,persist:true,cuttable:false,isProj:false,col});}}
   if(e.t===20)e.tele=0;
   if(e.t>=100)bossDone(e,sp);
   break;
  case'teleport':
   e.vx=0;
   if(e.t===1){e.tele=1;burst(cxOf(e),cyOf(e),col,16,4,{g:0});e.hide=true;}
   if(e.t===12){e.tpX=clamp(cxOf(P)-P.face*90,40,G.roomW-40);addFx({kind:'tmark',x:e.tpX,y:FLOOR-2,r:40,col:'#ff3040',life:14});}
   if(e.t===24){e.x=clamp((e.tpX||cxOf(P)-P.face*90)-e.w/2,0,G.roomW-e.w);e.y=FLOOR-e.h;e.face=Math.sign(cxOf(P)-cxOf(e))||1;e.hide=false;burst(cxOf(e),cyOf(e),col,16,4,{g:0});}
   if(e.t===44){e.tele=0;eHit(e,eFront(e,150,120),1.2);sfx('slash');eSlashFx(e,95,col);}
   if(e.t>=70)bossDone(e,sp);
   break;
  case'volley':
   e.vx*=0.8;e.tele=e.t<30?1:0;
   if(e.t>=30&&(e.t-30)%18===0&&e.t<=30+18*(e.phase2?3:2)){const a0=Math.atan2(cyOf(P)-cyOf(e),dx);for(let i=-2;i<=2;i++){const a=a0+i*0.22;shoot({friend:false,kind:'orb',x:cxOf(e)-9,y:cyOf(e)-9,w:18,h:18,vx:Math.cos(a)*5.5,vy:Math.sin(a)*5.5,life:160,dmg:e.atk*0.7,col:'#ff3bd4'});}sfx('shoot');}
   if(e.t>=110)bossDone(e,sp);
   break;
  default:bossDone(e,sp);
 }
 physics(e);
 if(!e.hide&&e.st!=='dash'&&ov(e,P))hurtPlayer(e.atk*0.5,e);
}

/* ===================== 26. 처치 · 드롭 ===================== */
function killEnemy(e){
 if(e.dead)return;e.dead=true;e.hp=0;
 burst(cxOf(e),cyOf(e),e.boss?'#ff5a6a':'#d8d0ff',e.boss?40:16,e.boss?7:4);
 if(!e.D.noCodex){save.codex[e.type]=true;save.rec.kt=save.rec.kt||{};save.rec.kt[e.type]=(save.rec.kt[e.type]||0)+1;}
 if(run)run.kills++;save.rec.kills++;
 if(G.mode!=='training'){
  const g=e.D.gold||[0,0],gold=randi(g[0],g[1])*(e.elite?3:1)*(1+(eScale()-1)*0.5);
  const n=Math.min(12,Math.max(1,Math.round(gold/4)));
  for(let i=0;i<n;i++)drops.push({kind:'gold',v:gold/n,x:cxOf(e),y:cyOf(e),vx:rand(-3,3),vy:rand(-6,-2),t:0});
  if(Math.random()<(e.elite?0.4:0.05))drops.push({kind:'potion',x:cxOf(e),y:cyOf(e),vx:rand(-1,1),vy:-5,t:0});
  if(e.elite)save.ore++;
  gainXp((e.xp||0)*(e.elite?2.5:1)*(1+(eScale()-1)*0.5));
  if(e.boss)save.ore+=2+e.idx;lootOnKill(e);
 }
 if(run&&run.mods.killHeal)healP(run.mods.killHeal);
 if(e.boss){
  save.rec.bosses++;G.slow=50;shake(16);sfx('ult');signatureCut(e.B&&e.B.blade?(e.B.blade.glow||'#ff3040'):'#ff9a3c',true);
  for(const m of enemies)if(!m.dead&&!m.boss&&m.ai!=='dummy'){m.dead=true;burst(cxOf(m),cyOf(m),'#d8d0ff',10,3);}
  addFx({kind:'banner',txt:`${e.name} 격파!`,col:'#ffd77a',life:110});
 }else sfx('hit');
}
function updateDrops(){
 for(const d of drops){
  d.t++;const dd=Math.hypot(cxOf(P)-d.x,cyOf(P)-d.y);
  if(d.t>20&&dd<170&&!P.dead){d.x+=(cxOf(P)-d.x)*0.18;d.y+=(cyOf(P)-d.y)*0.18;}
  else{d.vy+=0.4;d.x+=d.vx;d.y+=d.vy;d.vx*=0.95;if(d.y>FLOOR-6){d.y=FLOOR-6;d.vy*=-0.3;d.vx*=0.7;}}
  if(d.t>20&&dd<26&&!P.dead){d.got=true;
   if(d.kind==='gold'){gainGold(d.v);sfx('coin');}
   else{P.potions=Math.min(save.potionMax+2,P.potions+1);sfx('select');addNum(cxOf(P),P.y-14,'물약 +1','#6dff8a');}}
 }
 drops=drops.filter(d=>!d.got);
}

/* ===================== 27. 투사체 ===================== */
function explodeProj(p){
 const cx=cxOf(p),cy=cyOf(p),r=p.explode;
 addFx({kind:'ring',x:cx,y:cy,r:8,max:r,col:p.col,life:14});burst(cx,cy,p.col,14,5);sfx('boom');shake(4);
 if(p.friend){for(const e of enemies)if(!e.dead&&!p.hit.has(e)&&Math.hypot(cxOf(e)-cx,cyOf(e)-cy)<r+e.w/2){p.hit.add(e);damageEnemy(e,p.dmg*0.8,{kb:6,burn:p.burn||0,col:p.col,noStack:true,ultMul:0.3});}}
 else if(Math.hypot(cxOf(P)-cx,cyOf(P)-cy)<r)hurtPlayer(p.dmg,p);
}
function updateProjs(){
 for(const p of projs){
  if(p.dead)continue;
  if(p.delay>0){p.delay--;continue;}
  p.life--;p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=p.grav;
  if(p.life<=0){if(p.explode)explodeProj(p);p.dead=true;continue;}
  if(p.x<-120||p.x>G.roomW+120||p.y>H+40){p.dead=true;continue;}
  if(p.explode&&p.y+p.h>=FLOOR){explodeProj(p);p.dead=true;continue;}
  if((p.kind==='rarrow'||(!p.friend&&p.kind==='rock'))&&p.y+p.h>=FLOOR){burst(cxOf(p),FLOOR,p.col,10,3,{up:2});p.dead=true;continue;}
  if(p.friend){
   const cx=cxOf(p),cy=cyOf(p);
   if(p.pull)for(const e of enemies)if(!e.dead&&!e.boss&&e.ai!=='dummy'&&Math.abs(cxOf(e)-cx)<140&&Math.abs(cyOf(e)-cy)<120)e.vx+=Math.sign(cx-cxOf(e))*0.6;
   for(const e of enemies){
    if(e.dead||!ov(p,e))continue;
    if(p.rehit){p.hm=p.hm||new Map();if(G.t-(p.hm.get(e)||-999)<p.rehit)continue;p.hm.set(e,G.t);}
    else{if(p.hit.has(e))continue;p.hit.add(e);}
    damageEnemy(e,p.dmg,{kb:p.kb||3,dir:Math.sign(p.vx)||1,burn:p.burn||0,col:p.col,noStack:true,ultMul:0.5});if(p.onHit)p.onHit(e,p);
    if(p.explode){explodeProj(p);p.dead=true;break;}
    if(!p.pierce){p.dead=true;break;}
   }
  }else if(ov(p,P)){
   const r=hurtPlayer(p.dmg,p);
   if(r&&!p.persist&&!p.friend)p.dead=true;
  }
 }
 projs=projs.filter(p=>!p.dead);
}

 if(run.wave%5===0)spawnBoss((run.wave/5-1)%5);
 else{const n=Math.min(10,2+run.wave);for(let i=0;i<n;i++)spawnEnemy(pick(POOLS[run.theme]),spawnX(180),{elite:run.wave>6&&Math.random()<0.15});}

}
function checkClear(){
 if(!run||P.dead)return;
 const alive=enemies.some(e=>!e.dead&&e.ai!=='dummy');
 if(run.rooms){
  const r=run.rooms[run.cur];
  if(!r.cleared&&!alive){
   r.cleared=true;
   if(r.type==='boss')onBossDefeated();
   else{sfx('level');addFx({kind:'banner',txt:'방 클리어!',col:'#ffd77a',life:60});writeSave();
    if(r.type==='ruin')ruinCleared();if(r.type==='combat'||r.type==='elite')G.after={t:45,fn:()=>openReward(r.type==='elite'?'elite':'room')};}
  }
 }else if(G.mode==='endless'){
  if(run.waveActive&&!alive){
   run.waveActive=false;save.rec.bestWave=Math.max(save.rec.bestWave,run.wave);writeSave(true);
   addFx({kind:'banner',txt:`${run.wave} 웨이브 돌파!`,col:'#ffd77a',life:70});G.waveT=150;
   if(run.wave%3===0)G.after={t:50,fn:()=>openReward('wave')};
  }else if(!run.waveActive&&--G.waveT<=0)startWave();
 }
}
function updateWorld(){
 G.t++;if(run)run.t++;
 updatePlayer();
 for(const e of enemies)if(!e.dead)updateEnemy(e);
 updateProjs();updateDrops();updateAllies();
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.96;p.life--;if(p.petal){p.rot+=p.vr||0.1;p.vx+=Math.sin(p.life*0.15)*0.05;}}

 for(const n of nums){n.y-=0.9;n.life--;}nums=nums.filter(n=>n.life>0);
 for(const f of fx)f.t++;fx=fx.filter(f=>f.t<f.life);

   case'tline':{const pul=0.5+0.5*Math.sin(f.t*0.5);ctx.globalAlpha=Math.min(1,(f.life-f.t)/8)*(0.35+0.4*pul);ctx.fillStyle=f.col;for(let x=0;x<f.len;x+=18)ctx.fillRect(f.x+f.dir*x-(f.dir<0?12:0),f.y-3,12,4);ctx.beginPath();const ex=f.x+f.dir*f.len;ctx.moveTo(ex,f.y-12);ctx.lineTo(ex+f.dir*18,f.y-1);ctx.lineTo(ex,f.y+10);ctx.fill();break;}

 <button class="btn" onclick="forgePromo()" ${nx&&w.p>=gr.max&&save.gold>=pc.gold&&save.ore>=pc.ore?'':'disabled'}>⬆️ 승급 → ${nx?nx.n:'최고 등급'} — ${pc.gold} G + 적철광 ${pc.ore}</button>

function rollRelics(src){
 const bonus=['chest','boss','elite'].includes(src)?1:0,out=[];let g=0;
 while(out.length<3&&g++<100){const rr=Math.random(),rar=rr<0.08+bonus*0.15?2:rr<0.38+bonus*0.2?1:0;
  const pool=RELICS.filter(r=>r.rar===rar&&!out.includes(r)&&!(['wave','parryBoom','rage'].includes(r.k)&&run.relics.includes(r)));
  if(pool.length)out.push(pick(pool));}
 return out;
}

 if(!run||!P||P.dead)return;G.paused=true;G.modal='reward';rewardOpts=rollRelics(src);
 const t={room:'방 클리어 보상',elite:'정예 처치 보상',chest:'보물 상자',boss:'보스 격파 보상',wave:'웨이브 돌파 보상'}[src]||'보상';
 setModal(`<div class="scr center"><h2>🎁 ${t}</h2><div class="muted" style="margin:6px 0 16px">하나를 선택하세요 (1 / 2 / 3)</div><div class="row" style="gap:16px">${rewardOpts.map((r,i)=>{const n=run.relics.filter(x=>x===r).length;
  return`<div class="rcard" style="--rc:${RAR[r.rar].col}" onclick="pickReward(${i})"><div class="ricon">${r.icon}</div><div class="rname" style="color:${RAR[r.rar].col}">${r.name}</div><div class="rrar">${RAR[r.rar].n}${r.instant?' · 즉시 효과':' · 유물'}</div><div class="rdesc">${r.desc}</div>${n?`<div class="muted sm">보유 ${n}개 · 중첩</div>`:''}<kbd>${i+1}</kbd></div>`;}).join('')}</div></div>`);

/* ===================== 45. v3 확장: 전투 보조 · 유파 메커니즘 ===================== */
const GLOWS={fire:{n:'화염 붉은색',col:'#ff4a3a'},holy:{n:'성광 황금색',col:'#ffd34d'},abyss:{n:'심연 보라색',col:'#a04dff'},sakura:{n:'벚꽃 분홍색',col:'#ff9ccf'},azure:{n:'청백 검광',col:'#9fe0ff'},blood:{n:'혈월 진홍',col:'#ff2040'}};
function hexRGB(h){if(typeof h!=='string'||h[0]!=='#')return[255,255,255];if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function hexA(h,a){const[r,g,b]=hexRGB(h);return`rgba(${r},${g},${b},${a})`;}
function toHex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function shade(h,amt){const[r,g,b]=hexRGB(h);return amt>=0?toHex(r+(255-r)*amt,g+(255-g)*amt,b+(255-b)*amt):toHex(r*(1+amt),g*(1+amt),b*(1+amt));}
function mixHex(a,b,t){const A=hexRGB(a),B=hexRGB(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
const easeOut=x=>1-Math.pow(1-x,3);
const _palC={};
function palFrom(base,cp){const k=base.id+'_'+cp.c+cp.d+cp.b;return _palC[k]||(_palC[k]=Object.assign({},base,{id:k,c:cp.c,d:cp.d,b:cp.b}));}
function playerPal(cls){cls=cls||save.cls;const C=CLASSES[cls],cp=save.custom.pal[cls];return cp?palFrom(C.pal,cp):C.pal;}
function bladeFor(C){const g=save.custom.glow&&GLOWS[save.custom.glow];return g?Object.assign({},C.blade,{glow:g.col}):C.blade;}
function trailCol(S){const t=save.custom.trail;if(t&&GLOWS[t])return GLOWS[t].col;return save.cls==='dual'?'#ff3fb4':S.col;}

function enemyThreat(){
 const px=cxOf(P),py=cyOf(P);
 for(const e of enemies){if(e.dead||e.ai==='dummy')continue;const d=Math.abs(cxOf(e)-px),dy=Math.abs(cyOf(e)-py);
  if(e.boss){if(d<440&&(e.tele||['combo','dash','slam','teleport','nova','phase'].includes(e.st)))return true;if(d<e.w/2+70)return true;continue;}
  if((e.st==='wind'||e.st==='dive')&&d<260)return true;
  if(e.D&&e.D.contact&&d<110&&dy<100)return true;}
 for(const p of projs){if(p.friend||p.dead)continue;
  if(p.warnX!==undefined&&Math.abs(p.warnX-px)<90)return true;
  if(p.kind==='pillar'&&Math.abs(cxOf(p)-px)<90)return true;
  if(Math.hypot(cxOf(p)-px,cyOf(p)-py)<240)return true;}
 return false;
}
/* 보스 데미지 캡(1초 창 15%) + 페이즈 경계 고정 */
function bossGate(e,dmg){
 if(e.st==='phase'||e.pendingPhase)return 0;
 const cap=e.maxHp*0.15;
 if(!e.capW||G.t-e.capW.t0>60)e.capW={t0:G.t,sum:0};
 dmg=Math.min(dmg,cap-e.capW.sum);if(dmg<=0)return 0;
 const th=[0.7,0.3][e.phase||0];
 if(th!==undefined){const fl=Math.floor(e.maxHp*th);if(e.hp-dmg<=fl){dmg=Math.max(0,e.hp-fl);e.pendingPhase=true;}}
 dmg=Math.max(0,Math.round(dmg));e.capW.sum+=dmg;return dmg;
}

/* ===================== 49. 🌐 온라인 1:1 결투 — WebRTC P2P (PeerJS) =====================

   · 피격 판정은 "맞는 쪽 권위(victim-authoritative)": 공격자는 자기 화면에서 맞췄다고 판단하면 hit 를 보내고,
     맞는 쪽이 자기 무적/회피/패링/막기 상태로 최종 판정 → 결과(res)를 돌려준다. 패링당하면 공격자가 기절. */

function netHost(){loadPeerJS(()=>{netClose(true);const code=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[randi(0,31)]).join('');NET.host=true;NET.code=code;netStatus('방 개설 중…');

 peer.on('connection',c=>{if(NET.conn&&NET.conn.open){c.on('open',()=>c.close());return;}netBind(c);});

 c.on('open',()=>{netStatus('🔗 상대와 연결되었습니다!');c.send({t:'hello',me:netMe()});sfx('select');if(G.scene==='hub'&&$('netst'))showOnline();});

function netSend(o){if(NET.conn&&NET.conn.open)try{NET.conn.send(o);}catch(e){}}
function netClose(keepCode){if(NET.conn)try{NET.conn.close();}catch(e){}if(NET.peer)try{NET.peer.destroy();}catch(e){}NET.conn=null;NET.peer=null;NET.remote=null;NET.rival=null;if(!keepCode)NET.code='';}

function netRematch(){if(!NET.conn||!NET.conn.open){toast('상대와 연결되어 있지 않습니다');return;}if(NET.host)netStart();else{netSend({t:'rematch',me:netMe()});toast('재대결을 요청했습니다');}}
function netRecv(m){if(!m||!m.t)return;
 switch(m.t){

  case'dead':if(G.mode==='pvp'&&NET.rival&&!NET.rival.dead){NET.rival.dead=true;pvpWin();}break;
 }}

   외곽선을 입혀 화면에 2배(AP) 확대 출력. 포즈만 바꾸면 사선 베기·발도·찌르기 등 모든 동작이 나온다. */

  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
  xs.sort((p,q)=>p-q);for(let i=0;i+1<xs.length;i+=2){const xa=Math.round(xs[i]),xb=Math.round(xs[i+1]);if(xb>xa)RG.fillRect(xa,y,xb-xa,1);}}}

 o=o||{};const win=pr<0.22,k=win?0:easeOut(clamp((pr-0.22)/0.33,0,1)),a=clamp(pr/0.22,0,1);
 const two=!o.dual&&o.two!==false;p.two=two;
 switch(arc){
  case'v':p.feet=[[lerp(3.5,5.5,k),0],[lerp(-4,-5.5,k),0]];p.hip=[lerp(-0.5,1,k),lerp(-10.6,-9.6,k)];p.lean=win?lerp(0.06,-0.14,a):lerp(-0.14,0.42,k);
   p.hands=[win?lp2([3,5],[-0.5,-6.5],a):lp2([-0.5,-6.5],[7,5.5],k),[-1,4]];p.w=win?lerp(0.6,-2.35,a):lerp(-2.35,0.95,k);p.head.t=win?0:0.5*k;break;
  case'v2':p.feet=[[lerp(3,5,k),0],[-5,0]];p.hip=[0.5,lerp(-10.2,-10.8,k)];p.lean=win?lerp(0.06,0.32,a):lerp(0.32,-0.08,k);
   p.hands=[win?lp2([3,5],[-3,7.5],a):lp2([-3,7.5],[6,-4.5],k),[-1,5]];p.w=win?lerp(0.7,2.5,a):lerp(2.5,-1.15,k);p.head.t=win?0.5:-0.2*k;break;
  case'h':p.feet=[[5,0],[-4.5,0]];p.hip=[0.5,-10.4];p.lean=win?-0.1:lerp(-0.1,0.3,k);
   p.hands=[win?lp2([3,5],[-4,1],a):lp2([-4,1],[7.5,1.5],k),[-1,4]];p.w=win?lerp(0.6,-2.9,a):lerp(-2.9,0.15,k);break;
  case'thrust':p.feet=[[lerp(3,8,k),0],[lerp(-4,-6.5,k),0]];p.hip=[lerp(-1,1.5,k),lerp(-10.8,-9.2,k)];p.lean=win?-0.05:lerp(-0.05,0.5,k);
   p.hands=[win?lp2([3,5],[-3,4],a):lp2([-3,4],[10,2],k),[-2,5]];p.w=0.04;p.two=false;break;
  case'spin':{const w=-1.5+pr*6.283;p.feet=[[5,0],[-5,0]];p.hip=[0,-10];p.lean=0.05;p.hands=[[Math.cos(w)*5+1,Math.sin(w)*4+3],[-1,4]];p.w=w;break;}
  case'line':p.feet=[[9,0],[-8,0]];p.hip=[1,-8.2];p.lean=0.55;p.hands=[[10,1],[-4,6]];p.w=0.02;p.two=false;break;
  default:p.hands=[[7,4],[-1,5]];p.w=0.6;
 }
 if(o.dual){p.w2=p.w+(arc==='spin'?3.14:-0.8);p.hands[1]=[p.hands[0][0]-4.5,p.hands[0][1]+1.5];}
}

 L.sky=up2(L.sky);for(const l of L.layers)l.c=up2(l.c);return _bgCache[i]=L;}

}

 for(const p of plats){ctx.save();ctx.translate(0,p.y);

function migrateSave(raw){
 const v=raw&&raw.ver||1;
 if(v<3){if(save.title==='검성'&&!save.custom.title)save.custom.title='검성';
  for(const k in save.custom.pal){const c=save.custom.pal[k];if(c&&!(c.c&&c.d&&c.b))save.custom.pal[k]=null;}}
 if(v<4){if(save.level>=5)save.jobDone=true;else{save.jobDone=false;save.cls='novice';}
  if(save.level<15)for(const k of['swordsman','knight','dual','mage'])save.style[k]='basic';}
 if(v<5){if(save.chapter>=3)save.unlocked.shaman=true;}
 save.ver=5;
 if(!STYLES[save.cls])save.cls=save.jobDone?'swordsman':'novice';
 for(const k in STYLES)if(!save.style[k]||!STYLES[k][save.style[k]])save.style[k]='basic';
}
function gainXp(n){
 n=Math.round(n);save.xp+=n;if(run)run.xp+=n;
 while(save.xp>=xpNeed(save.level)){
  save.xp-=xpNeed(save.level);save.level++;save.sp+=3;sfx('level');
  if(P&&!P.dead){P.hp=Math.min(P.maxHp,P.hp+P.maxHp*0.25);addFx({kind:'text',x:cxOf(P),y:P.y-40,txt:'LEVEL UP!',col:'#ffd77a',life:70});}
  toast(`⬆️ 레벨 ${save.level} 달성! 스탯 +3${save.level>=15?' · 스킬 트리 +1':''}`);
  if(save.level===5&&!save.jobDone)addFx({kind:'banner',txt:'🎖️ 전직 가능 — 거점의 [전직] 메뉴에서 직업을 고르세요',col:'#ffd77a',life:160});
  if(save.level===15&&save.jobDone)addFx({kind:'banner',txt:'🏯 유파 개방 — 거점의 [캐릭터 · 유파]에서 유파를 고르세요',col:'#ffd77a',life:160});
 }
}
function completeChapter(c){
 const S=STORY[c];let msg;
 if(c>=save.chapter){const s=5+c*3;save.chapter=c+1;save.gold+=S.gold;save.soul=(save.soul||0)+s;msg=`제${c+1}장 클리어! 보상: ${S.reward} + 🔮검혼석 ${s}`;
  if(c===0)save.unlocked.dual=true;if(c===1)save.unlocked.mage=true;if(c===2)save.unlocked.shaman=true;if(c===4)save.title='검성';}
 else{const g=Math.round(S.gold*0.3);save.gold+=g;msg=`제${c+1}장 재클리어 — ${g} G`;}
 writeSave(true);return msg;
}

/* ---- 5. 저장 · 진행도 ---- */
function ensureV12(){if(typeof save.prologue!=='number')save.prologue=(save.chapter>=1||save.jobDone||save.level>=5)?3:0;
 if(!save.fac||typeof save.fac!=='object')save.fac={};if(!save.stele||typeof save.stele!=='object')save.stele={};
 for(let i=0;i<FAC.length;i++)if(save.chapter>FAC[i].ch&&!save.fac[i])save.fac[i]=1;}
function campSteps(){const s=PRO.map((p,i)=>({k:'pro',i}));for(let c=0;c<5;c++){FAC.forEach((f,i)=>{if(f.ch===c)s.push({k:'fac',i});});s.push({k:'ch',i:c});}return s;}
function campStat(s){if(s.k==='pro')return{done:s.i<save.prologue,open:s.i<=save.prologue};
 if(s.k==='fac'){const f=FAC[s.i],first=FAC.findIndex(x=>x.ch===f.ch);return{done:!!save.fac[s.i],open:save.prologue>=3&&save.chapter>=f.ch&&(s.i===first||!!save.fac[s.i-1])};}
 return{done:s.i<save.chapter,open:s.i<=save.chapter};}
function stepInfo(s){if(s.k==='pro')return{name:PRO[s.i].n,fn:`playStage('pro',${s.i})`};
 if(s.k==='fac')return{name:`〔${FAC[s.i].tier}〕 ${FAC[s.i].n.split(' — ')[0]} 토벌`,fn:`playStage('fac',${s.i})`};
 return{name:`제${s.i+1}장 · ${STORY[s.i].title}`,fn:`startChapter(${s.i})`};}

/* ---- 6. 스테이지(서장·세력) 진행 ---- */
function playStage(kind,i){ensureV12();if(!campStat({k:kind,i}).open)return;const D=kind==='pro'?PRO[i]:FAC[i];setUI('');showDialog(D.intro,()=>stageStart(kind,i));}
function stageStart(kind,i){const D=kind==='pro'?PRO[i]:FAC[i];G.lastStg={kind,i};startRun('endless');G.mode='stage';run.mode='stage';run.chapter=i;
 run.stg={kind,i,D,t:70};run.theme=D.th||0;run.scale=D.sc||1;run.wave=0;run.waveActive=false;

 else addFx({kind:'banner',txt:'⏱ 시간 초과 — 다시 도전하세요',col:'#ff9a9a',life:100});
 writeSave(true);G.after={t:120,fn:goHub};}
const _g4dm=damageEnemy;damageEnemy=function(e,base,o){o=o||{};const r=_g4dm(e,base,o),j=G.jt;
 if(r>0&&j&&!j.done&&e&&e.ai==='dummy'){const mine=G.mhit||o.col===MATES[j.k].col;
  if(mine)e.mLast=G.t;else if(G.t-(e.mLast==null?-99:e.mLast)<60){e.mLast=-99;j.n++;addFx({kind:'text',x:cxOf(e),y:e.y-30,txt:`연계! ${j.n}/${j.need}`,col:MATES[j.k].col,life:40});sfx('select');if(j.n>=j.need)jtDone(true);}}
 return r;};
const _g4uw=updateWorld;updateWorld=function(){_g4uw();const j=G.jt;if(j&&!j.done&&G.mode==='training'&&--j.t<=0)jtDone(false);};
const _g4gh=goHub;goHub=function(){G.jt=null;_g4gh();};

/* 동료 화면: 관리 패널 */
const _g4sm=showMates;showMates=function(){_g4sm();const sc=document.querySelector('#ui .scroll');if(!sc)return;
 const ks=Object.keys(MATES).filter(k=>save.comp&&save.comp[k]);
 sc.insertAdjacentHTML('beforeend',`<div class="sec">🛠️ 동료 관리 — 승급 · 장비 · 꾸미기 · 합동 훈련</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${ks.map(k=>{
  const D=MATES[k],c=save.comp[k],g=gearOf(k),R=mateReq(k),M=MRANK[k],nm=it=>it?`${it.icon} ${it.name}`:'없음';
  const path=M?M.t.map((n,i)=>i===rankOf(k)?`<b style="color:${D.col}">${n}</b>`:`<span class="muted">${n}</span>`).join(' → '):`<b style="color:${D.col}">${D.title}</b>`;
  return`<div class="card" style="padding:8px"><div class="ct" style="font-size:13px">${D.name} <span class="muted sm">훈련 Lv.${c.jtLv||0}/10</span></div><div class="kv sm">${path}</div>
  <div class="kv sm">⚔ ${nm(g.w)} · 🛡 ${nm(g.a)} · 💍 ${nm(g.c)}</div><div class="kv sm muted">공격 x${mateMul(k).toFixed(2)} · HP x${mateHpMul(k).toFixed(2)} · 방어력 ${mateArm(k)}</div>
  <div class="kv sm ${R.ok?'':'muted'}">${R.done?'✔ '+R.why:`다음: 「${R.next}」 — ${R.why}`}</div>
  <div class="row" style="gap:4px;margin-top:4px;flex-wrap:wrap">${!R.done?`<button class="btn sm ${R.ok?'gold':''}" ${R.ok?'':'disabled'} onclick="promoteMate('${k}')">🎖️ 승급</button>`:''}
  <button class="btn sm" onclick="showMateLook('${k}')">🎨 꾸미기</button><button class="btn sm" onclick="showMateGear('${k}')">🎁 장비 선물</button>
  <button class="btn sm" onclick="startJT('${k}')" ${c.jtRun===save.rec.runs||(c.jtLv||0)>=10?'disabled':''}>🤝 합동 훈련</button></div></div>`;}).join('')}</div>`);};

/* ── 버전 표기: 버전 11 ── */
const _v11ti=showTitle;showTitle=function(){_v11ti();const v=document.querySelector('#ui .ver');if(v)v.textContent='검성 · 버전 11';};
const _v11mn=showMenu;showMenu=function(){_v11mn();const v=document.querySelector('#ui .ver');if(v)v.textContent='검성 · 버전 11 · 자동 저장 지원';};

/* ── ⑥ 저장 슬롯 · 내보내기 ── */
/* ===================== 70. 저장 슬롯 5개 · 내보내기(다운로드) · 가져오기 · 자동 백업 ===================== */
const SLOT_N=5,SLOT_CUR_KEY='swordmaster_slot';
const slotKey=n=>n===1?SAVE_KEY:SAVE_KEY+'_s'+n;
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){return false;}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
let curSlot=clamp(parseInt(lsGet(SLOT_CUR_KEY))||1,1,SLOT_N);
function readSlot(n){try{return JSON.parse(lsGet(slotKey(n)));}catch(e){return null;}}
const isSaveObj=o=>!!(o&&typeof o==='object'&&typeof o.level==='number'&&o.rec&&o.cls);
function backupSlot(n){const v=lsGet(slotKey(n));if(v)lsSet(slotKey(n)+'_bak',v);}
function refreshRuntime(){applyAllLooks();applyAdvNames();applyCrt();}

/* 저장 · 불러오기를 현재 슬롯 기준으로 */
writeSave=function(silent){save.hasSave=true;save.savedAt=Date.now();
 if(lsSet(slotKey(curSlot),JSON.stringify(save))){if(!silent)toast(`💾 자동 저장됨 (슬롯 ${curSlot})`);}
 else toast('⚠️ 저장 공간이 부족합니다 — 슬롯을 정리하거나 내보내기 해 두세요');};
loadSave=function(){try{const s=JSON.parse(lsGet(slotKey(curSlot)));if(s){save=deepMerge(defaultSave(),s);migrateSave(s);return true;}}catch(e){}
 const st=save&&save.settings;save=defaultSave();if(st)save.settings=st;return false;};
wipeSave=function(){if(!confirm(`슬롯 ${curSlot}의 진행 상황을 삭제할까요? (직전 상태는 백업으로 남습니다)`))return;
 backupSlot(curSlot);lsDel(slotKey(curSlot));const s=save.settings;save=defaultSave();save.settings=s;refreshRuntime();toast('저장 데이터를 초기화했습니다');showSettings();};

/* 슬롯 전환 */
function resetRuntime(){run=null;P=null;enemies=[];projs=[];parts=[];nums=[];fx=[];drops=[];mates=[];
 Object.assign(G,{mode:null,after:null,paused:false,modal:null,jt:null,vx:null,vf:1});rewardOpts=null;dlg=null;setModal('');}
function switchSlot(n,then){if(save.hasSave)writeSave(true);resetRuntime();curSlot=n;lsSet(SLOT_CUR_KEY,String(n));
 loadSave();refreshRuntime();toast(`💾 슬롯 ${n}${save.hasSave?' 불러옴':' (빈 슬롯)'}`);(then||showMenu)();}
function newInSlot(n){const s=readSlot(n);if(s&&!confirm(`슬롯 ${n}에 있는 Lv.${s.level} 데이터를 덮어쓰고 새로 시작할까요? (백업이 남습니다)`))return;
 switchSlot(n,()=>newGame(true));}
const _g5ng=newGame;newGame=function(force){
 if(save.hasSave&&force!==true){showSlots('new');return;}
 if(force===true&&save.hasSave){backupSlot(curSlot);save.hasSave=false;try{_g5ng();}finally{save.hasSave=true;}return;}
 _g5ng();};
function delSlot(n){const s=readSlot(n);if(!s)return;if(!confirm(`슬롯 ${n} (Lv.${s.level})을 삭제할까요? 직전 상태는 백업으로 남습니다.`))return;
 backupSlot(n);lsDel(slotKey(n));if(n===curSlot){const st=save.settings;save=defaultSave();save.settings=st;refreshRuntime();}toast(`🗑 슬롯 ${n} 삭제`);showSlots(G.slotMode);}
function restoreBak(n){const b=lsGet(slotKey(n)+'_bak');if(!b)return;if(!confirm(`슬롯 ${n}을 직전 백업으로 되돌릴까요?`))return;
 const cur=lsGet(slotKey(n));lsSet(slotKey(n),b);if(cur)lsSet(slotKey(n)+'_bak',cur);
 if(n===curSlot)switchSlot(n,()=>showSlots(G.slotMode));else{toast('↺ 백업 복원');showSlots(G.slotMode);}}

/* 내보내기 */
const ymd=()=>{const d=new Date();return`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;};
function dlJSON(obj,name){try{const b=new Blob([JSON.stringify(obj)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('⬇ 내려받기를 시작했습니다');}
 catch(e){toast('내려받기가 막혀 있어요 — 📋 복사를 이용하세요');}}
function exportSlot(n){if(n===curSlot&&save.hasSave)writeSave(true);const s=readSlot(n);if(!s)return;dlJSON(s,`검성_슬롯${n}_Lv${s.level}_${ymd()}.json`);}
function exportAll(){if(save.hasSave)writeSave(true);const o={app:'swordmaster',ver:1,slots:{}};for(let n=1;n<=SLOT_N;n++){const s=readSlot(n);if(s)o.slots[n]=s;}
 if(!Object.keys(o.slots).length){toast('내보낼 데이터가 없습니다');return;}dlJSON(o,`검성_전체슬롯_${ymd()}.json`);}
function copySlot(n){if(n===curSlot&&save.hasSave)writeSave(true);const t=lsGet(slotKey(n));if(!t)return;const io=$('slotio');if(io)io.value=t;
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('📋 세이브 코드를 복사했습니다'),()=>toast('아래 칸의 코드를 직접 복사하세요'));else toast('아래 칸의 코드를 직접 복사하세요');}

/* 가져오기 */
function importText(text,n){let o;try{o=JSON.parse(text);}catch(e){toast('⚠️ 올바른 세이브 파일이 아닙니다');return;}
 if(o&&o.slots&&typeof o.slots==='object'){const ks=Object.keys(o.slots).filter(k=>isSaveObj(o.slots[k])&&+k>=1&&+k<=SLOT_N);
  if(!ks.length){toast('⚠️ 가져올 슬롯이 없습니다');return;}
  if(!confirm(`전체 백업에서 슬롯 ${ks.join(', ')}을(를) 덮어쓸까요? (기존 데이터는 백업으로 남습니다)`))return;
  for(const k of ks){backupSlot(+k);lsSet(slotKey(+k),JSON.stringify(o.slots[k]));}
  toast(`⬆ ${ks.length}개 슬롯을 가져왔습니다`);if(ks.includes(String(curSlot)))switchSlot(curSlot,()=>showSlots(G.slotMode));else showSlots(G.slotMode);return;}
 if(!isSaveObj(o)){toast('⚠️ 검성 세이브 데이터가 아닙니다');return;}
 const old=readSlot(n);if(old&&!confirm(`슬롯 ${n} (Lv.${old.level})을 가져온 데이터(Lv.${o.level})로 덮어쓸까요? (기존 데이터는 백업으로 남습니다)`))return;
 backupSlot(n);lsSet(slotKey(n),JSON.stringify(o));toast(`⬆ 슬롯 ${n}에 가져왔습니다`);
 if(n===curSlot)switchSlot(n,()=>showSlots(G.slotMode));else showSlots(G.slotMode);}
function pickImport(n){G.impTarget=n;const f=$('slotfile');if(f){f.value='';f.click();}}
function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(String(r.result),G.impTarget||curSlot);r.readAsText(f);}
function importPaste(){const t=($('slotio')||{}).value||'',n=parseInt(($('slotsel')||{}).value)||curSlot;if(!t.trim()){toast('세이브 코드를 붙여 넣으세요');return;}importText(t.trim(),n);}

/* 슬롯 화면 */
function slotDesc(s){const c=s.cls,tier=s.adv&&s.adv[c];
 const nm=tier&&ADV[c]?ADV[c][tier-1]:(BASE_NM[c]||(CLASSES[c]&&CLASSES[c].name)||c),ic=CLASSES[c]?CLASSES[c].icon:'❔';
 const sex=s.custom&&s.custom.gender&&s.custom.gender[c]==='f'?'👩':'🧑';
 return`<div class="ct">${ic} ${nm} Lv.${s.level} ${sex}${s.custom&&s.custom.title?` <span style="color:#ffd77a">〔${s.custom.title}〕</span>`:''}</div>
 <div class="kv sm">스토리 ${s.chapter||0}/5장 · ${s.demon?'2부 마왕강림':'1부 혈천교편'} · 난이도 ${(DIFF[s.settings&&s.settings.diff]||DIFF[1]).n}</div>
 <div class="kv sm">💰 ${(s.gold||0).toLocaleString()} G · 🔮 ${s.soul||0} · 플레이 ${fmtT((s.rec&&s.rec.time)||0)}</div>
 <div class="kv sm muted">마지막 저장 ${s.savedAt?new Date(s.savedAt).toLocaleString('ko-KR'):'-'}</div>`;}
function showSlots(mode,from){G.slotMode=mode||'';if(from)G.slotFrom=from;G.back=G.slotFrom||showMenu;if(save.hasSave)writeSave(true);
 const cards=Array.from({length:SLOT_N},(_,i)=>{const n=i+1,s=readSlot(n),cur=n===curSlot,bak=!!lsGet(slotKey(n)+'_bak'),B=(l,f,c)=>`<button class="btn sm ${c||''}" onclick="${f}">${l}</button>`;
  const main=mode==='new'?B(s?'⚠ 덮어쓰고 새로 시작':'✨ 여기서 새로 시작',`newInSlot(${n})`,s?'red':'gold')
   :cur?'<span class="badge" style="background:#3a7a4a">사용 중</span>':B(s?'▶ 불러오기':'이 슬롯 선택',`switchSlot(${n})`,s?'gold':'');
  return`<div class="card ${cur?'sel':''}" style="padding:8px"><div class="row" style="justify-content:space-between"><b>슬롯 ${n}</b>${main}</div>
  ${s?slotDesc(s):'<div class="kv muted" style="margin:10px 0">비어 있음</div>'}
  <div class="row" style="gap:4px;margin-top:6px;flex-wrap:wrap">${s?B('⬇ 내보내기',`exportSlot(${n})`)+B('📋 복사',`copySlot(${n})`):''}${B('⬆ 가져오기',`pickImport(${n})`)}${s?B('🗑',`delSlot(${n})`,'red'):''}${bak?B('↺ 백업 복원',`restoreBak(${n})`):''}</div></div>`;}).join('');
 setUI(`<div class="scr"><div class="hdr"><h2>💾 저장 슬롯${mode==='new'?' — 새 여정을 시작할 슬롯을 고르세요':''}</h2>
 <div class="row"><button class="btn" onclick="exportAll()">⬇ 전체 내보내기</button><button class="btn" onclick="pickImport(${curSlot})">⬆ 파일 가져오기</button><button class="btn" onclick="G.back()">← 돌아가기</button></div></div>
 <div class="scroll" style="flex:1"><div class="grid3">${cards}</div>
 <div class="card" style="margin-top:10px"><div class="sec" style="margin-top:0">📋 세이브 코드로 옮기기 (다운로드가 막힌 환경 · 다른 기기)</div>
 <textarea id="slotio" rows="3" placeholder="여기에 세이브 코드를 붙여 넣거나, 슬롯의 📋 복사를 누르면 코드가 표시됩니다" onkeydown="event.stopPropagation()" onkeyup="event.stopPropagation()"
  style="width:100%;font:11px monospace;background:#0b0a14;color:#d8d6e8;border:1px solid #4a4670;padding:6px;resize:vertical"></textarea>
 <div class="row" style="margin-top:4px"><select id="slotsel" style="font:inherit;background:#141322;color:#fff;border:1px solid #4a4670;padding:3px">${Array.from({length:SLOT_N},(_,i)=>`<option value="${i+1}" ${i+1===curSlot?'selected':''}>슬롯 ${i+1}</option>`).join('')}</select>
 <button class="btn sm gold" onclick="importPaste()">이 슬롯으로 가져오기</button></div></div>
 <div class="muted sm" style="margin-top:8px;line-height:1.6">• 세이브는 이 브라우저에 저장됩니다. 브라우저 데이터를 지우면 사라지니 가끔 ⬇ 내보내기로 파일을 받아 두세요.<br>
 • 덮어쓰기 · 삭제 · 가져오기 · 새로 시작 직전의 상태는 슬롯마다 1개씩 자동 백업되고, ↺ 백업 복원으로 되돌릴 수 있습니다.<br>• 「전체 내보내기」 파일을 가져오면 들어 있는 슬롯들이 한 번에 복원됩니다.</div></div>
 <input type="file" id="slotfile" accept=".json,application/json" style="display:none" onchange="importFile(this)"></div>`);}

/* 메뉴 · 설정에 연결 */
const _g5mn=showMenu;showMenu=function(){_g5mn();const m=document.querySelector('#ui .menu-main');if(!m)return;
 const b=[...m.querySelectorAll('button')].find(x=>x.textContent.includes('환경 설정'));
 if(b)b.insertAdjacentHTML('beforebegin',`<button class="btn big" onclick="showSlots('',showMenu)">💾 저장 슬롯 · 내보내기 <span class="muted">슬롯 ${curSlot}</span></button>`);
 const v=document.querySelector('#ui .ver');if(v)v.textContent+=` · 슬롯 ${curSlot}/${SLOT_N}`;};
const _g5set=showSettings;showSettings=function(b){_g5set(b);if(G.scene==='play')return;const c=$('ui').querySelector('.card');
 if(c)c.insertAdjacentHTML('beforeend',`<div class="opt"><span>저장 슬롯 (현재 ${curSlot})</span><button class="btn sm" onclick="rebinding=null;writeSave(true);showSlots('',()=>showSettings())">💾 슬롯 · 내보내기</button></div>`);};

/* @@V11-END@@ */

/* ===================== 44. 메인 루프 · 초기화 ===================== */
let lastT=performance.now(),acc=0,slowTog=false;
function frame(){
 G.menuT++;
 for(const p of menuPetals){p.x+=p.vx;p.y+=p.vy;p.a+=0.03;if(p.y>H){p.y=-8;p.x=rand(0,W);}if(p.x<-10)p.x=W;if(p.x>W+10)p.x=0;}
 if(G.scene==='play'&&run&&P&&!G.paused&&!G.modal){
  fxTick();
  if(G.cut)updateCut();
  else if(G.hitstop>0)G.hitstop--;
  else if(G.slow>0){G.slow--;slowTog=!slowTog;if(slowTog)updateWorld();}
  else updateWorld();
  save.rec.time+=1/60;
  if(G.after&&--G.after.t<=0){const f=G.after.fn;G.after=null;f();}
  if(G.mode==='training'&&G.menuT%15===0)refreshTrainDps();
 }
 for(const k in keyHit)delete keyHit[k];
 for(const k in touchHit)delete touchHit[k];
}
function loop(now){
 acc+=Math.min(100,now-lastT);lastT=now;let n=0;
 while(acc>=1000/60&&n<4){acc-=1000/60;frame();n++;}
 if(n>=4)acc=0;
 render();requestAnimationFrame(loop);
}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.scene==='play'&&!G.modal)openPause();});
document.head.insertAdjacentHTML('beforeend','<style>@keyframes blink{50%{opacity:.25}}</style>');
loadSave();applyCrt();buildTouch();fit();showTitle();requestAnimationFrame(loop);
</script>
