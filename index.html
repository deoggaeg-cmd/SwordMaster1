.btn:hover{border-color:#ffd77a;color:#fff}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0a14}

function burst(x,y,col,n=8,sp=4,o={}){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rand(sp*0.3,sp),l=o.life||randi(14,26);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0),life:l,max:l,col,sz:o.sz||randi(2,4),g:o.g===undefined?0.15:o.g});}}

/* ===================== 13. 물리 (플레이어·적 공용) ===================== */
function physics(o,noGrav){
 if(!noGrav)o.vy=Math.min(o.vy+GRAV,18);
 o.x+=o.vx;o.x=clamp(o.x,0,G.roomW-o.w);
 const prevB=o.y+o.h;o.y+=o.vy;o.ground=false;o.onPlat=false;
 if(o.vy>=0){for(const p of plats){
  if(o.x+o.w<=p.x||o.x>=p.x+p.w)continue;
  if(p.oneway&&o.dropT>0)continue;
  if(prevB<=p.y+1&&o.y+o.h>=p.y){o.y=p.y-o.h;o.vy=0;o.ground=true;o.onPlat=!!p.oneway;break;}
 }}
 if(o.y+o.h>FLOOR){o.y=FLOOR-o.h;o.vy=0;o.ground=true;o.onPlat=false;}
}

function damageEnemy(e,base,o={}){
 if(e.dead||e.invulnT>0)return 0;
 const st=P.st,crit=!!o.forceCrit||Math.random()<st.crit;
 let dmg=base*(crit?st.critDmg:1)*rand(0.92,1.08);
 if(e.boss)dmg*=1+st.boss;
 dmg=Math.max(1,Math.round(dmg));
 e.hp-=dmg;e.flash=6;
 const dir=o.dir||(cxOf(e)>cxOf(P)?1:-1);
 const kb=(o.kb===undefined?3:o.kb)*(e.heavy||e.boss?0.3:1);
 if(e.ai!=='dummy'){e.vx=dir*kb;if(kb>4&&!e.fly&&!e.boss)e.vy=-kb*0.5;if(!e.boss)e.stagger=Math.max(e.stagger||0,o.stagger||10);}
 if(o.stun)e.stun=Math.max(e.stun||0,e.boss?o.stun*0.4:o.stun);
 if(o.burn)e.burn=Math.max(e.burn||0,o.burn);
 addNum(cxOf(e),e.y-6,dmg,crit?'#ffd34d':'#ffffff',crit);
 burst(cxOf(e),cyOf(e),o.col||'#fff',crit?10:5,crit?5:3.5);
 sfx(o.heavy?'heavy':'hit');
 if(crit){shake(4);if(!o.noStack&&!o.noUlt&&P.dbl<=0&&++P.critStack>=curStyle().dblN){P.critStack=0;P.dbl=12;}}else shake(2);
 G.hitstop=Math.max(G.hitstop,o.heavy?5:crit?3:1);
 if(st.steal>0)healP(dmg*st.steal,true);
 if(!o.noUlt)P.ultG=Math.min(100,P.ultG+(o.ultMul||1)*1.6*st.ultGain);
 if(run)run.dmg+=dmg;save.rec.dmg+=dmg;
 if(G.mode==='training'){const d=G.dps;if(!d.start||G.t-d.last>180){d.sum=0;d.start=G.t;}d.sum+=dmg;d.last=G.t;}
 if(o.melee){
  const S=curStyle();
  if(S.burnOnHit&&Math.random()<S.burnOnHit)e.burn=Math.max(e.burn||0,150);
  if(o.chain){let c=0;for(const t of enemies){if(t===e||t.dead||c>=2)continue;if(dist(t,e)<170){c++;addFx({kind:'zap',x1:cxOf(e),y1:cyOf(e),x2:cxOf(t),y2:cyOf(t),col:'#ffe95c',life:10});damageEnemy(t,dmg*0.45,{noStack:true,noUlt:true,col:'#ffe95c',kb:1});}}}
 }
 if(e.ai==='dummy')e.hp=e.maxHp;
 else if(e.hp<=0)killEnemy(e);
 return dmg;
}
function strike(box,mult,o={}){
 const hs=o.hitset;let n=0;
 for(const e of enemies){if(e.dead||(hs&&hs.has(e)))continue;if(ov(box,e)){if(hs)hs.add(e);damageEnemy(e,P.st.atk*mult,o);n++;}}
 if(!o.noCut)for(const p of projs){if(!p.friend&&!p.dead&&p.cuttable!==false&&ov(box,p)){p.dead=true;burst(cxOf(p),cyOf(p),'#ffffff',6,3);sfx('parry');}}

}
function hurtPlayer(dmg,src){
 if(!P||P.dead)return false;
 const S=curStyle();
 if(P.fortT>0){
  if(src&&src.isProj){src.friend=true;src.vx=-src.vx||P.face*10;src.vy=0;src.dmg=P.st.atk*2;src.hit=new Set();src.life=60;}
  else if(src&&src.hp!==undefined&&!src.dead)damageEnemy(src,P.st.atk*1.5,{noUlt:true,col:S.col});
  burst(cxOf(P),cyOf(P),S.col,8,3,{g:0});return false;
 }
 if(P.parryT>0||(P.guard&&P.guardT<=S.parryWin)){parrySuccess(src);return false;}
 if(P.inv>0)return false;
 if(G.mode==='training'&&G.trainInv){addNum(cxOf(P),P.y-8,Math.round(dmg),'#8a8aa0');P.inv=20;return false;}
 let d=dmg*DIFF[save.settings.diff].dmg*(1-P.st.def);
 if(P.guard){
  const front=!src||(cxOf(src)-cxOf(P))*P.face>=0;
  if(front){d*=0.2;sfx('parry');burst(cxOf(P)+P.face*16,cyOf(P),'#cfe0ff',8,3,{g:0});P.vx=-P.face*3;P.ultG=Math.min(100,P.ultG+3);addNum(cxOf(P),P.y-20,'막기','#9fb4ff');if(S.counter)P.counterQ=4;}
 }
 if(P.ironT>0)d*=1-P.ironRed;
 d=Math.max(1,Math.round(d));
 P.hp-=d;P.inv=40;P.hurtT=12;sfx('hurt');shake(7);
 addNum(cxOf(P),P.y-8,d,'#ff5a5a');burst(cxOf(P),cyOf(P),'#d0303a',10,4);
 P.ultG=Math.min(100,P.ultG+4);
 if(run&&run.mods.thorns&&src&&!src.isProj&&src.hp!==undefined&&!src.dead)damageEnemy(src,P.st.atk*run.mods.thorns,{noUlt:true,col:'#6dff8a'});
 if(!P.guard){const dir=src?(cxOf(P)>cxOf(src)?1:-1):-P.face;P.vx=dir*5;P.vy=-4;cancelAttack();P.plunge=false;}
 if(P.hp<=0){P.hp=0;P.dead=true;P.sk=null;P.ul=null;onPlayerDeath();}
 return true;
}

function useSkill(S){
 if(P.skillCd>0||P.sk||P.ul||P.dead)return;
 const sm=S.skillMod,C=CLASSES[save.cls],A=P.st.atk;
 cancelAttack();P.plunge=false;
 P.skillCd=Math.round(C.skill.cd*60*(sm.cdMul||1)*(1-P.st.cdr));sfx('skill');
 addFx({kind:'text',x:cxOf(P),y:P.y-30,txt:C.skill.name,col:S.col,life:45});
 if(save.cls==='swordsman'){P.sk={k:'flash',t:0,hit:new Set()};P.inv=Math.max(P.inv,22);}
 else if(save.cls==='knight'){
  P.ironT=Math.round(240*(sm.durMul||1));P.ironRed=sm.redu||0.5;
  for(const e of enemies)if(!e.dead&&dist(e,P)<170){const dir=cxOf(e)>cxOf(P)?1:-1;e.stun=Math.max(e.stun||0,30);damageEnemy(e,A*(sm.shock?3:0.8),{kb:10,dir,heavy:true,col:S.col});}

  addFx({kind:'ring',x:cxOf(P),y:cyOf(P),r:20,max:sm.shock?200:170,col:S.col,life:18});shake(8);

 }
 else if(save.cls==='dual'){P.sk={k:'lotus',t:0,done:0,hits:sm.hits||6};P.inv=Math.max(P.inv,10+(sm.hits||6)*5+12);}
 else if(save.cls==='mage'){P.sk={k:'burst',t:0};P.inv=Math.max(P.inv,12);}

 if(k.k==='flash'){

  strike({x:P.x-16,y:P.y-8,w:P.w+32,h:P.h+16},3.2*(sm.dmgMul||1),{hitset:k.hit,kb:6,heavy:true,forceCrit:sm.forceCrit,dir:P.face,col:S.col});

 }else if(k.k==='iron'){P.vx*=0.7;if(k.t>=14)P.sk=null;}
 else if(k.k==='lotus'){
  k.noGrav=true;P.vy=0;
  if(k.t<=10){P.vx=P.face*15;addTrail(S.col,10);}
  else{
   P.vx*=0.6;const n=k.t-10;
   if(n%5===1){k.done++;
    strike({x:P.face>0?P.x-10:P.x+P.w-130,y:P.y-26,w:140,h:P.h+52},0.75,{hitset:new Set(),kb:1.5,forceCrit:sm.forceCrit,dir:P.face,col:S.col,stagger:16});
    addFx({kind:'slash',h:{arc:pick(['v','v2','h']),w:130,h:100},col:S.col,life:8,follow:true,face:P.face});sfx('slash');}
   if(k.done>=k.hits){P.sk=null;if(sm.tornado)firePlayerProj('tornado',S);}
  }
 }else if(k.k==='burst'){
  P.vx*=0.7;const fire=sm.pull?18:6;
  if(sm.pull&&k.t<fire){for(const e of enemies)if(!e.dead&&!e.boss&&e.ai!=='dummy'&&dist(e,P)<300)e.vx+=(cxOf(P)>cxOf(e)?1:-1)*1.4;if(k.t%4===0)burst(cxOf(P),cyOf(P),S.col,6,4,{g:0});}
  if(k.t===fire){
   sfx('boom');shake(10);addFx({kind:'ring',x:cxOf(P),y:cyOf(P),r:20,max:200,col:S.col,life:20});burst(cxOf(P),cyOf(P),S.col,24,6,{g:0});
   for(const e of enemies)if(!e.dead&&dist(e,P)<200)damageEnemy(e,A*3.5*(sm.dmgMul||1),{kb:9,dir:cxOf(e)>cxOf(P)?1:-1,burn:sm.burn?180:0,stun:sm.stun||0,col:S.col,heavy:true});
  }

 P.x=clamp(cxOf(e)+side*(e.w/2+18)-P.w/2,0,G.roomW-P.w);P.y=Math.min(FLOOR-P.h,e.y+e.h-P.h);P.face=-side;

function castUlt(S){
 if(P.ultG<100||P.ul||P.sk||P.dead)return;
 const U=S.ult,A=P.st.atk;P.ultG=0;cancelAttack();P.plunge=false;
 sfx('ult');shake(12);G.flash={col:U.col,t:18};addFx({kind:'banner',txt:U.name,col:U.col,life:80});P.inv=Math.max(P.inv,30);
 switch(U.type){
  case'dashes':case'execute':P.ul={type:U.type,n:U.n,t:0,lock:true,noGrav:true};break;

  case'nova':
   for(const e of enemies)if(!e.dead&&dist(e,P)<320)damageEnemy(e,A*U.dmg,{kb:10,heavy:true,noUlt:true,noStack:true,col:U.col});
   healP(P.maxHp*U.heal);addFx({kind:'ring',x:cxOf(P),y:cyOf(P),r:20,max:320,col:U.col,life:26});burst(cxOf(P),cyOf(P),U.col,30,7,{g:0});break;

function updateUlt(S){
 const u=P.ul,U=S.ult,A=P.st.atk;u.t++;
 const live=enemies.filter(e=>!e.dead);
 switch(u.type){
  case'dashes':case'execute':{
   const gap=u.type==='dashes'?14:8;P.vx=0;P.vy=0;
   if(u.t%gap===1){if(!live.length||u.n<=0){P.ul=null;break;}teleStrike(u.type==='dashes'?nearest(live):pick(live),A*U.dmg,U.col);u.n--;}
   if(P.ul&&u.n<=0&&u.t%gap===gap-1)P.ul=null;break;}
  case'screen':
   P.vx=0;P.vy=0;
   if(u.t===24){shake(16);sfx('boom');for(const e of live)if(cxOf(e)>G.camX-40&&cxOf(e)<G.camX+W+40)damageEnemy(e,A*U.dmg,{kb:8,heavy:true,noUlt:true,noStack:true,col:U.col,forceCrit:true});}
   if(u.t>=40)P.ul=null;break;
  case'storm':
   if(u.t%8===0){strike({x:cxOf(P)-110,y:cyOf(P)-85,w:220,h:170},U.dmg,{hitset:new Set(),kb:2,noUlt:true,noStack:true,col:U.col,stagger:12});if(u.t%16===0)sfx('slash');}
   if(u.t>=u.dur)P.ul=null;break;

   if(u.t===18)P.vy=24;
   if(u.t>18&&P.ground){
    shake(18);sfx('boom');addFx({kind:'ring',x:cxOf(P),y:P.y+P.h,r:20,max:420,col:U.col,life:24});burst(cxOf(P),P.y+P.h,U.col,30,7,{up:3});
    for(const e of live)if(Math.abs(cxOf(e)-cxOf(P))<420&&e.y+e.h>FLOOR-160)damageEnemy(e,A*U.dmg,{kb:12,heavy:true,noUlt:true,noStack:true,col:U.col,stun:40});
    firePlayerProj('shock',S,{dmg:A*2,life:40},1);firePlayerProj('shock',S,{dmg:A*2,life:40},-1);P.ul=null;
   }else if(u.t>120)P.ul=null;break;
  case'waves':
   if(u.t%6===1&&u.n>0){firePlayerProj('bigwave',S,{dmg:A*U.dmg,col:U.col});u.n--;}
   if(u.n<=0)P.ul=null;break;

   if(u.t%9===1&&u.n>0){const e=live.length?pick(live):null;const tx=e?cxOf(e)+rand(-50,50):G.camX+rand(100,W-100);

   if(u.n<=0)P.ul=null;break;
  case'thunder':
   if(u.t%5===1&&u.n>0){if(live.length){const e=pick(live);damageEnemy(e,A*U.dmg,{stun:24,noUlt:true,noStack:true,col:U.col,kb:1});addFx({kind:'bolt',x:cxOf(e),y:e.y+e.h,col:U.col,life:12});sfx('shoot');}u.n--;}
   if(u.n<=0)P.ul=null;break;

/* ===================== 20. 플레이어 업데이트 ===================== */
const tk=v=>v>0?v-1:0;
function updatePlayer(){
 const S=curStyle();
 P.st=calcStats();P.maxHp=P.st.maxHp;if(P.hp>P.maxHp)P.hp=P.maxHp;
 for(const k of['inv','hurtT','dodgeCd','parryT','parryCd','skillCd','comboWin','ironT','hasteT','fortT','dropT'])P[k]=tk(P[k]);
 G.doorMsg=tk(G.doorMsg);P.anim++;
 for(const t of P.trail)t.life--;P.trail=P.trail.filter(t=>t.life>0);
 if(P.dead){P.vx*=0.9;physics(P);return;}
 if(P.ul)P.inv=Math.max(P.inv,2);
 if(!(P.sk||(P.ul&&P.ul.lock))){if(hit('potion'))usePotion();if(hit('skill'))useSkill(S);if(hit('ult'))castUlt(S);}
 if(P.ul)updateUlt(S);
 if(P.sk)updateSkill(S);
 if(P.whirl){P.whirl=0;doWhirl(S);}
 if(P.dbl>0){if(P.dbl===12||P.dbl===5)doubleStrike(S,P.dbl===12);P.dbl--;}
 if(P.counterQ>0&&--P.counterQ===0)counterStrike(S);
 const busy=!!(P.sk||(P.ul&&P.ul.lock));
 const guardType=S.dodge.type==='guard';
 const wantGuard=guardType&&held('dodge')&&P.ground&&!busy&&P.atkT<=0&&P.hurtT<=0;
 if(wantGuard){if(!P.guard)P.guardT=0;P.guard=true;P.guardT++;}else{P.guard=false;P.guardT=999;}
 let noGrav=!!((P.sk&&P.sk.noGrav)||(P.ul&&P.ul.noGrav));
 if(P.dodgeT>0){
  P.dodgeT--;const d=S.dodge;
  if(d.type==='dash'){P.vx=P.dodgeDir*d.spd;P.vy=0;noGrav=true;}
  else if(d.type==='roll')P.vx=P.dodgeDir*d.spd;
  if(P.anim%2===0)addTrail(S.col);
  if(d.slash&&d.type!=='blink')strike({x:P.x-12,y:P.y,w:P.w+24,h:P.h},0.8,{hitset:P.dodgeHit,kb:2,col:S.col});
 }else if(!busy){
  const mv=(held('right')?1:0)-(held('left')?1:0);
  const sp=P.st.spd*(P.guard?0.25:1)*(P.charging?0.4:1)*(P.atkT>0&&P.ground?0.3:1);
  if(mv){P.vx+=(mv*sp-P.vx)*0.35;if(P.atkT<=0&&!P.charging)P.face=mv;}else P.vx*=P.ground?0.7:0.93;
  if(hit('jump')&&!P.plunge){
   if(held('down')&&P.ground&&P.onPlat){P.dropT=16;P.ground=false;P.y+=3;}
   else if(P.ground){P.vy=-11.6;P.jumps=1;P.ground=false;burst(cxOf(P),P.y+P.h,'#aaaaaa',5,2,{g:0});}
   else if(P.jumps<2){P.vy=-10.2;P.jumps=2;burst(cxOf(P),P.y+P.h,S.col,6,2.5,{g:0});sfx('dash');}
  }
  if(!held('jump')&&P.vy<-3)P.vy+=0.5;
  if(hit('dodge')&&!guardType)startDodge(S);
  if(hit('parry')&&P.parryCd<=0)startParry(S);
  if(hit('up'))interact();
  if(!P.guard&&P.dodgeT<=0){
   if(hit('attack')){
    if(!P.ground&&held('down')){if(!P.plunge){cancelAttack();P.plunge=true;P.plungeHit=new Set();P.vx=0;sfx('dash');}}
    else if(!P.plunge){if(S.charge&&P.atkT<=0&&!P.charging){P.charging=true;P.chargeT=0;}else pressAttack(S);}
   }
   if(P.charging){
    if(held('attack')){P.chargeT++;if(P.chargeT===S.charge.time){sfx('select');burst(cxOf(P),cyOf(P),S.col,14,4,{g:0});}}
    else{P.charging=false;if(P.chargeT>=S.charge.time)chargedSlash(S);else pressAttack(S);}
   }
  }
 }
 if(P.atkT>0){
  const h=P.atkCur,pr=1-P.atkT/P.atkDur;
  if(pr>=0.2&&pr<=0.72)strike(atkBox(h),h.dmg,{hitset:P.atkHit,kb:h.kb,heavy:h.heavy,dir:P.face,chain:h.chain,melee:true,col:S.col});
  if(pr>=0.3&&!P.atkFired){
   P.atkFired=true;
   if(h.proj)firePlayerProj(h.proj,S);
   if(h.shock&&P.ground)firePlayerProj('shock',S);
   if(P.atkI===S.combo.length-1&&run&&run.mods.wave)firePlayerProj('wave',S);
  }
  if(!P.ground)P.vy=Math.min(P.vy,1.5);
  P.atkT--;
  if(P.atkT<=0){if(P.queue&&P.atkI>=0&&!busy)startAttack(S,(P.atkI+1)%S.combo.length);else P.comboWin=16;}
 }else if(P.comboWin<=0)P.atkI=-1;

/* ===================== 22. 던전 생성 (BFS 연결 검증) ===================== */
function genFloor(seed,nRooms){
 const R=mulberry(seed),rooms=[],grid={},key=(x,y)=>x+','+y;
 const add=(gx,gy)=>{const r={id:rooms.length,gx,gy,type:'combat',doors:{},cleared:false,visited:false,looted:false,seed:Math.floor(R()*1e9)};rooms.push(r);grid[key(gx,gy)]=r;return r;};
 add(0,0);
 const dirs=[[1,0,'r','l'],[-1,0,'l','r'],[0,-1,'u','d'],[0,1,'d','u']];
 let guard=0;
 while(rooms.length<nRooms&&guard++<800){
  const base=rooms[Math.floor(R()*rooms.length)];
  const d=R()<0.7?(R()<0.75?dirs[0]:dirs[1]):dirs[2+Math.floor(R()*2)];
  const nx=base.gx+d[0],ny=base.gy+d[1];
  if(Math.abs(ny)>2||nx<-2||grid[key(nx,ny)])continue;
  const n=add(nx,ny);base.doors[d[2]]=n.id;n.doors[d[3]]=base.id;
 }
 const dA=rooms.map(()=>-1);dA[0]=0;const q=[0];
 while(q.length){const c=q.shift();for(const k in rooms[c].doors){const t=rooms[c].doors[k];if(dA[t]<0){dA[t]=dA[c]+1;q.push(t);}}}
 rooms.forEach((r,i)=>r.dist=dA[i]);
 if(rooms.some(r=>r.dist<0))return genFloor(seed+1,nRooms);
 rooms[0].type='start';rooms[0].cleared=true;
 const order=rooms.slice(1).sort((a,b)=>b.dist-a.dist);
 const boss=order.find(r=>Object.keys(r.doors).length===1)||order[0];boss.type='boss';
 const rest=order.filter(r=>r!==boss);
 for(let i=rest.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
 if(rest[0])rest[0].type='treasure';
 if(rest[1])rest[1].type='shrine';
 let el=nRooms>7?2:1;
 for(const r of rest.slice(2))if(el>0&&r.dist>=2){r.type='elite';el--;}
 for(const r of rooms)if(r.type==='treasure'||r.type==='shrine')r.cleared=true;
 return rooms;
}
function buildRoom(r){
 const R=mulberry(r.seed);
 G.roomW=['boss','start','treasure','shrine'].includes(r.type)?W:(R()<0.55?1440:1200);
 const RW=G.roomW,T1=FLOOR-112,T2=FLOOR-205,T3=FLOOR-298,mid=RW/2;
 const hasU=r.doors.u!==undefined,hasD=r.doors.d!==undefined;
 plats=[{x:0,y:FLOOR,w:RW,h:H-FLOOR,oneway:false}];doors=[];props=[];
 if(r.type==='boss'){plats.push({x:120,y:T1,w:160,h:14,oneway:true},{x:RW-280,y:T1,w:160,h:14,oneway:true},{x:mid-90,y:T2,w:180,h:14,oneway:true});}
 else{let x=110+R()*60,i=0;while(x<RW-220){const w=130+R()*80;if(!(hasU&&Math.abs(x+w/2-mid)<240)){plats.push({x,y:T1,w,h:14,oneway:true});if(i%2===1&&R()<0.7)plats.push({x:x+60,y:T2,w:120+R()*50,h:14,oneway:true});}x+=w+110+R()*120;i++;}}
 if(hasU){plats.push({x:mid-230,y:T1,w:130,h:14,oneway:true},{x:mid+100,y:T2,w:130,h:14,oneway:true},{x:mid-90,y:T3,w:180,h:14,oneway:true});doors.push({x:mid-24,y:T3-76,w:48,h:76,dir:'u',to:r.doors.u});}
 if(hasD)doors.push({x:mid-24,y:FLOOR-76,w:48,h:76,dir:'d',to:r.doors.d});
 if(r.doors.l!==undefined)doors.push({x:0,y:FLOOR-96,w:34,h:96,dir:'l',to:r.doors.l});
 if(r.doors.r!==undefined)doors.push({x:RW-34,y:FLOOR-96,w:34,h:96,dir:'r',to:r.doors.r});
 const px=mid+(hasD?140:0);
 if(r.type==='treasure')props.push({kind:'chest',x:px-24,y:FLOOR-34,w:48,h:34,used:r.looted});
 if(r.type==='shrine')props.push({kind:'shrine',x:px-26,y:FLOOR-90,w:52,h:90,used:r.looted});
}
function populate(r){

}

 if(e.ai==='dummy'){e.vx*=0.8;physics(e);return;}

 if(e.stagger>0&&!(e.heavy&&e.st==='wind')){e.stagger--;if(e.st!=='dive')e.st='idle';e.vx*=0.85;move();return;}
 e.stagger=0;
 const dx=cxOf(P)-cxOf(e),adx=Math.abs(dx),sg=Math.sign(dx)||1;

   else if(e.st==='rec'){e.vx*=0.8;if(--e.t<=0)e.st='idle';}
   else{e.face=sg;if(e.ai==='melee'&&adx>56)e.vx=sg*e.spd;else e.vx*=0.7;if(adx<(e.ai==='sparring'?130:84)&&e.cd<=0){e.st='wind';e.t=e.D.wind||30;}}
   break;
  case'ranged':

   else{e.face=sg;if(adx<220)e.vx=-sg*e.spd;else if(adx>420)e.vx=sg*e.spd;else e.vx*=0.8;if(e.cd<=0&&adx<560&&Math.abs(cyOf(P)-cyOf(e))<70){e.st='wind';e.t=30;}}

    if(e.cd<=0&&adx<300){const a=Math.atan2(cyOf(P)-cyOf(e),dx);e.vx=Math.cos(a)*7;e.vy=Math.sin(a)*7;e.st='dive';e.t=36;}}

     shoot({friend:false,kind:'shock',x:cxOf(e)+e.face*40-20,y:FLOOR-26,w:40,h:26,vx:e.face*6,life:50,dmg:e.atk*0.7,persist:true,cuttable:false,isProj:false,col:'#ff8a5c'});

   if(e.t>=110)bossDone(e,sp);

  case'pillars':

   if(e.t===20)e.tele=0;
   if(e.t>=100)bossDone(e,sp);
   break;
  case'teleport':
   e.vx=0;
   if(e.t===1){e.tele=1;burst(cxOf(e),cyOf(e),col,16,4,{g:0});e.hide=true;}
   if(e.t===24){e.x=clamp(cxOf(P)-P.face*90-e.w/2,0,G.roomW-e.w);e.y=FLOOR-e.h;e.face=Math.sign(cxOf(P)-cxOf(e))||1;e.hide=false;burst(cxOf(e),cyOf(e),col,16,4,{g:0});}
   if(e.t===44){e.tele=0;eHit(e,eFront(e,150,120),1.2);sfx('slash');eSlashFx(e,95,col);}
   if(e.t>=70)bossDone(e,sp);
   break;
  case'volley':
   e.vx*=0.8;e.tele=e.t<30?1:0;
   if(e.t>=30&&(e.t-30)%18===0&&e.t<=30+18*(e.phase2?3:2)){const a0=Math.atan2(cyOf(P)-cyOf(e),dx);for(let i=-2;i<=2;i++){const a=a0+i*0.22;shoot({friend:false,kind:'orb',x:cxOf(e)-9,y:cyOf(e)-9,w:18,h:18,vx:Math.cos(a)*5.5,vy:Math.sin(a)*5.5,life:160,dmg:e.atk*0.7,col:'#ff3bd4'});}sfx('shoot');}
   if(e.t>=110)bossDone(e,sp);
   break;

 }
 physics(e);
 if(!e.hide&&e.st!=='dash'&&ov(e,P))hurtPlayer(e.atk*0.5,e);

/* ===================== 26. 처치 · 드롭 ===================== */
function killEnemy(e){
 if(e.dead)return;e.dead=true;e.hp=0;
 burst(cxOf(e),cyOf(e),e.boss?'#ff5a6a':'#d8d0ff',e.boss?40:16,e.boss?7:4);
 if(!e.D.noCodex)save.codex[e.type]=true;
 if(run)run.kills++;save.rec.kills++;
 if(G.mode!=='training'){
  const g=e.D.gold||[0,0],gold=randi(g[0],g[1])*(e.elite?3:1)*(1+(eScale()-1)*0.5);
  const n=Math.min(12,Math.max(1,Math.round(gold/4)));
  for(let i=0;i<n;i++)drops.push({kind:'gold',v:gold/n,x:cxOf(e),y:cyOf(e),vx:rand(-3,3),vy:rand(-6,-2),t:0});
  if(Math.random()<(e.elite?0.4:0.05))drops.push({kind:'potion',x:cxOf(e),y:cyOf(e),vx:rand(-1,1),vy:-5,t:0});
  if(e.elite)save.ore++;
  gainXp((e.xp||0)*(e.elite?2.5:1)*(1+(eScale()-1)*0.5));
  if(e.boss)save.ore+=2+e.idx;
 }
 if(run&&run.mods.killHeal)healP(run.mods.killHeal);
 if(e.boss){
  save.rec.bosses++;G.slow=50;shake(16);sfx('ult');
  for(const m of enemies)if(!m.dead&&!m.boss&&m.ai!=='dummy'){m.dead=true;burst(cxOf(m),cyOf(m),'#d8d0ff',10,3);}
  addFx({kind:'banner',txt:`${e.name} 격파!`,col:'#ffd77a',life:110});
 }else sfx('hit');
}
function updateDrops(){
 for(const d of drops){
  d.t++;const dd=Math.hypot(cxOf(P)-d.x,cyOf(P)-d.y);
  if(d.t>20&&dd<170&&!P.dead){d.x+=(cxOf(P)-d.x)*0.18;d.y+=(cyOf(P)-d.y)*0.18;}
  else{d.vy+=0.4;d.x+=d.vx;d.y+=d.vy;d.vx*=0.95;if(d.y>FLOOR-6){d.y=FLOOR-6;d.vy*=-0.3;d.vx*=0.7;}}
  if(d.t>20&&dd<26&&!P.dead){d.got=true;
   if(d.kind==='gold'){gainGold(d.v);sfx('coin');}
   else{P.potions=Math.min(save.potionMax+2,P.potions+1);sfx('select');addNum(cxOf(P),P.y-14,'물약 +1','#6dff8a');}}
 }
 drops=drops.filter(d=>!d.got);
}

/* ===================== 27. 투사체 ===================== */
function explodeProj(p){
 const cx=cxOf(p),cy=cyOf(p),r=p.explode;
 addFx({kind:'ring',x:cx,y:cy,r:8,max:r,col:p.col,life:14});burst(cx,cy,p.col,14,5);sfx('boom');shake(4);
 if(p.friend){for(const e of enemies)if(!e.dead&&!p.hit.has(e)&&Math.hypot(cxOf(e)-cx,cyOf(e)-cy)<r+e.w/2){p.hit.add(e);damageEnemy(e,p.dmg*0.8,{kb:6,burn:p.burn||0,col:p.col,noStack:true,ultMul:0.3});}}
 else if(Math.hypot(cxOf(P)-cx,cyOf(P)-cy)<r)hurtPlayer(p.dmg,p);
}
function updateProjs(){
 for(const p of projs){
  if(p.dead)continue;
  if(p.delay>0){p.delay--;continue;}
  p.life--;p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=p.grav;
  if(p.life<=0){if(p.explode)explodeProj(p);p.dead=true;continue;}
  if(p.x<-120||p.x>G.roomW+120||p.y>H+40){p.dead=true;continue;}
  if(p.explode&&p.y+p.h>=FLOOR){explodeProj(p);p.dead=true;continue;}
  if(!p.friend&&p.kind==='rock'&&p.y+p.h>=FLOOR){burst(cxOf(p),FLOOR,p.col,10,3,{up:2});p.dead=true;continue;}
  if(p.friend){
   const cx=cxOf(p),cy=cyOf(p);
   if(p.pull)for(const e of enemies)if(!e.dead&&!e.boss&&e.ai!=='dummy'&&Math.abs(cxOf(e)-cx)<140&&Math.abs(cyOf(e)-cy)<120)e.vx+=Math.sign(cx-cxOf(e))*0.6;
   for(const e of enemies){
    if(e.dead||!ov(p,e))continue;
    if(p.rehit){p.hm=p.hm||new Map();if(G.t-(p.hm.get(e)||-999)<p.rehit)continue;p.hm.set(e,G.t);}
    else{if(p.hit.has(e))continue;p.hit.add(e);}
    damageEnemy(e,p.dmg,{kb:p.kb||3,dir:Math.sign(p.vx)||1,burn:p.burn||0,col:p.col,noStack:true,ultMul:0.5});
    if(p.explode){explodeProj(p);p.dead=true;break;}
    if(!p.pierce){p.dead=true;break;}
   }
  }else if(ov(p,P)){
   const r=hurtPlayer(p.dmg,p);
   if(r&&!p.persist&&!p.friend)p.dead=true;
  }
 }
 projs=projs.filter(p=>!p.dead);
}

/* ===================== 28. 방 클리어 · 웨이브 · 월드 업데이트 ===================== */
function startWave(){
 run.wave++;run.waveActive=true;run.theme=Math.floor((run.wave-1)/5)%5;run.scale=1+(run.wave-1)*0.09;
 if(run.wave%5===0)spawnBoss((run.wave/5-1)%5);
 else{const n=Math.min(10,2+run.wave);for(let i=0;i<n;i++)spawnEnemy(pick(POOLS[run.theme]),spawnX(180),{elite:run.wave>6&&Math.random()<0.15});}
 addFx({kind:'banner',txt:`웨이브 ${run.wave}${run.wave%5===0?' — 보스 출현!':''}`,col:'#ff7a7a',life:80});
}
function checkClear(){
 if(!run||P.dead)return;
 const alive=enemies.some(e=>!e.dead&&e.ai!=='dummy');
 if(run.rooms){
  const r=run.rooms[run.cur];
  if(!r.cleared&&!alive){
   r.cleared=true;
   if(r.type==='boss')onBossDefeated();
   else{sfx('level');addFx({kind:'banner',txt:'방 클리어!',col:'#ffd77a',life:60});writeSave();
    if(r.type==='combat'||r.type==='elite')G.after={t:45,fn:()=>openReward(r.type==='elite'?'elite':'room')};}
  }
 }else if(G.mode==='endless'){
  if(run.waveActive&&!alive){
   run.waveActive=false;save.rec.bestWave=Math.max(save.rec.bestWave,run.wave);writeSave(true);
   addFx({kind:'banner',txt:`${run.wave} 웨이브 돌파!`,col:'#ffd77a',life:70});G.waveT=150;
   if(run.wave%3===0)G.after={t:50,fn:()=>openReward('wave')};
  }else if(!run.waveActive&&--G.waveT<=0)startWave();
 }
}
function updateWorld(){
 G.t++;if(run)run.t++;
 updatePlayer();
 for(const e of enemies)if(!e.dead)updateEnemy(e);
 updateProjs();updateDrops();
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.96;p.life--;}
 parts=parts.filter(p=>p.life>0);if(parts.length>600)parts.splice(0,parts.length-600);
 for(const n of nums){n.y-=0.9;n.life--;}nums=nums.filter(n=>n.life>0);
 for(const f of fx)f.t++;fx=fx.filter(f=>f.t<f.life);
 enemies=enemies.filter(e=>!e.dead);
 checkClear();
 if(G.t%5===0){const T=THEMES[run.theme]||THEMES[0];parts.push({x:G.camX+rand(0,W),y:-6,vx:rand(-0.8,0.2),vy:rand(0.6,1.2),life:420,max:420,col:T.pcol,sz:2,g:0});}
 G.shake*=0.86;if(G.shake<0.3)G.shake=0;
 if(G.flash&&--G.flash.t<=0)G.flash=null;
}

const setModal=h=>{$('modal').innerHTML=h;};
const place=h=>{if(G.scene==='play')setModal(h);else setUI(h);};
const fmtT=s=>{s=Math.floor(s);return`${Math.floor(s/3600)}시간 ${Math.floor(s/60)%60}분 ${s%60}초`;};
const modeName=()=>({expedition:'⚔️ 원정',campaign:'📜 스토리 캠페인',endless:'👹 무한 서바이벌',training:'🎯 훈련장'})[G.mode]||'';
function keepScroll(fn){const el=document.querySelector('#ui .scroll'),s=el?el.scrollTop:0;fn();const n=document.querySelector('#ui .scroll');if(n)n.scrollTop=s;}
function applyCrt(){$('crt').style.display=save.settings.crt?'block':'none';}

 setUI(`<div class="menu-main"><div class="logo-s">劍聖 검성<span>SWORD MASTER</span></div>
 <button class="btn big gold" onclick="newGame()">⚔️ 새로운 여정</button>

 <button class="btn big" onclick="showSettings(showMenu)">⚙️ 환경 설정</button>

function newGame(){if(save.hasSave&&!confirm('기존 저장 데이터를 덮어쓰고 새로 시작할까요?'))return;const st=save.settings;save=defaultSave();save.settings=st;writeSave(true);setUI('');G.scene='hub';showDialog(PROLOGUE,showHub);}

/* ===================== 34. 대화창 ===================== */
function showDialog(lines,cb){dlg={lines,i:0,cb};G.modal='dialog';renderDialog();}
function renderDialog(){const[s,t]=dlg.lines[dlg.i];setModal(`<div class="dialog" onclick="advDialog()"><button class="btn sm" style="position:absolute;right:12px;top:8px" onclick="event.stopPropagation();skipDialog()">건너뛰기 ▶▶</button>${s?`<div class="spk">${s}</div>`:''}<div class="txt">${t}</div><div class="nxt">클릭 / Space / Enter ▶ (${dlg.i+1}/${dlg.lines.length})</div></div>`);}
function advDialog(){if(!dlg)return;sfx('select');if(++dlg.i>=dlg.lines.length){const cb=dlg.cb;dlg=null;G.modal=null;setModal('');if(cb)cb();}else renderDialog();}

 💰 ${save.gold.toLocaleString()} G · 🪨 적철광 ${save.ore} · 🧪 물약 ${save.potionMax}
 <div class="sec">기본 조작</div><span class="muted">${K('left')}/${K('right')} 이동 · ${K('jump')} 점프(2단) · ${K('attack')} 공격 · ${K('dodge')} 회피 · ${K('parry')} 패링 · ${K('up')} 문/상호작용 · ${K('pause')} 일시정지</span></div>`);
}

/* ===================== 36. 캐릭터 · 유파 · 스탯 ===================== */
function showChar(){
 G.back=showHub;
 const cls=Object.keys(CLASSES).map(k=>{const C=CLASSES[k],u=save.unlocked[k],sel=save.cls===k;
  return`<div class="card ${sel?'sel':''} ${u?'':'lock'}"><div class="ct">${C.icon} ${C.name} <span class="muted">${C.role} · ${C.weapon}</span></div><div class="kv">${C.desc}</div><div class="kv">HP ${C.hp} · 공격 ${C.atk} · 이속 ${C.spd}</div><div class="kv" style="color:#ffd77a">${C.skill.name} — ${C.skill.desc}</div>
  ${u?`<button class="btn sm" style="margin-top:6px" ${sel?'disabled':''} onclick="pickClass('${k}')">${sel?'✔ 선택됨':'선택'}</button>`:`<div class="kv muted">🔒 ${C.unlockText}</div><button class="btn sm gold" style="margin-top:4px" onclick="buyClass('${k}')" ${save.gold>=C.cost?'':'disabled'}>${C.cost} G로 즉시 해금</button>`}</div>`;}).join('');
 const SS=STYLES[save.cls];
 const sty=Object.keys(SS).map(k=>{const s=SS[k],sel=save.style[save.cls]===k;
  return`<div class="card ${sel?'sel':''}" style="cursor:pointer" onclick="pickStyle('${k}')"><div class="ct" style="color:${s.col}">${s.icon} ${s.name} ${sel?'✔':''}</div><div class="kv">${s.desc}</div><div class="kv">콤보 ${s.combo.length}타 · 공속 x${s.atkSpd} · 회피: ${DODGE_NAME[s.dodge.type]}</div><div class="kv">스킬 강화: ${s.skillMod.desc}</div><div class="kv" style="color:${s.col}">궁극기 ${s.ult.name}: ${s.ult.desc}</div><div class="kv muted">이연격 ${s.dblN}치명 · 대회전베기 ${s.whirlN}패링${s.counter?' · 자동 반격':''}${s.charge?' · 발도 차지':''}</div></div>`;}).join('');
 const stats=STATS.map(s=>`<div class="stat"><span style="color:${s.col}">${s.name}</span><b>${save.stats[s.k]}</b><span class="muted sm">${s.desc}</span><div class="row" style="gap:4px"><button class="btn sm" onclick="addStat('${s.k}',1)" ${save.sp>=1?'':'disabled'}>+1</button><button class="btn sm" onclick="addStat('${s.k}',5)" ${save.sp>=5?'':'disabled'}>+5</button></div></div>`).join('');
 const st=calcStats();
 setUI(`<div class="scr"><div class="hdr"><h2>🧍 캐릭터 · 유파 · 스탯</h2><button class="btn" onclick="showHub()">← 거점</button></div><div class="scroll" style="flex:1">
 <div class="sec" style="margin-top:0">직업</div><div class="grid4">${cls}</div>
 <div class="sec">${CLASSES[save.cls].name} 전용 유파</div><div class="grid3">${sty}</div>
 <div class="sec">스탯 투자 — 남은 포인트 <span style="color:#fff">${save.sp}</span> <button class="btn sm" onclick="resetStats()" ${save.gold>=200?'':'disabled'}>초기화 (200G)</button></div><div class="statgrid">${stats}</div>
 <div class="muted">최대 HP ${st.maxHp} · 공격력 ${st.atk.toFixed(1)} · 치명타 ${(st.crit*100).toFixed(1)}% · 이속 ${st.spd.toFixed(2)} · 쿨감 ${(st.cdr*100).toFixed(0)}% · 피해감소 ${(st.def*100).toFixed(0)}%</div></div></div>`);
}
function pickClass(k){if(!save.unlocked[k])return;save.cls=k;sfx('select');writeSave(true);keepScroll(showChar);}
function buyClass(k){const C=CLASSES[k];if(save.gold<C.cost)return;save.gold-=C.cost;save.unlocked[k]=true;save.cls=k;sfx('level');toast(`${C.icon} ${C.name} 해금!`);writeSave(true);keepScroll(showChar);}
function pickStyle(k){save.style[save.cls]=k;sfx('select');writeSave(true);keepScroll(showChar);}
function addStat(k,n){if(save.sp<n)return;save.sp-=n;save.stats[k]+=n;sfx('select');writeSave(true);keepScroll(showChar);}
function resetStats(){if(save.gold<200)return;let t=0;for(const k in save.stats){t+=save.stats[k];save.stats[k]=0;}save.sp+=t;save.gold-=200;toast('스탯을 초기화했습니다');writeSave(true);keepScroll(showChar);}

/* ===================== 37. 대장간 ===================== */
const upCost=w=>100*(w.p+1)*(w.g+1);
const promoCost=w=>({gold:500*(w.g+1),ore:3*(w.g+1)});
const potCost=()=>400*(save.potionMax-2);
function showForge(){
 G.back=showHub;
 const c=save.cls,C=CLASSES[c],w=save.weapons[c],gr=GRADES[w.g],nx=GRADES[w.g+1],pc=promoCost(w);
 const opt=w.opt?`${OPTS.find(o=>o.k===w.opt.k).name} +${(w.opt.v*100).toFixed(1)}%`:'없음';
 const list=Object.keys(CLASSES).map(k=>{const x=save.weapons[k],g=GRADES[x.g];return`<div class="kv">${CLASSES[k].icon} <span style="color:${g.col}">[${g.n}] ${CLASSES[k].wname} +${x.p}</span> ${save.unlocked[k]?'':'<span class="muted">(미해금)</span>'}</div>`;}).join('');
 setUI(`<div class="scr"><div class="hdr"><h2>🔨 대장간</h2><div class="row"><span>💰 ${save.gold.toLocaleString()} G · 🪨 ${save.ore}</span><button class="btn" onclick="showHub()">← 거점</button></div></div>
 <div class="row" style="align-items:stretch;gap:14px"><div class="card" style="flex:1"><div class="muted">${C.icon} ${C.name}의 ${C.weapon}</div><div class="wname" style="color:${gr.col}">[${gr.n}] ${C.wname} +${w.p}</div>
 <div class="kv">무기 배율 x${weaponMul(c).toFixed(2)} · 강화 한도 +${gr.max}</div><div class="kv">특수 옵션: ${opt}</div>
 <div class="col" style="margin-top:12px">
 <button class="btn gold" onclick="forgeUp()" ${w.p<gr.max&&save.gold>=upCost(w)?'':'disabled'}>⚒️ 강화 +${w.p+1} — ${upCost(w)} G${w.p>=gr.max?' (한도 도달 · 승급 필요)':''}</button>
 <button class="btn" onclick="forgePromo()" ${nx&&w.p>=gr.max&&save.gold>=pc.gold&&save.ore>=pc.ore?'':'disabled'}>⬆️ 승급 → ${nx?nx.n:'최고 등급'} — ${pc.gold} G + 적철광 ${pc.ore}</button>
 <button class="btn" onclick="forgeOpt()" ${save.gold>=150&&save.ore>=1?'':'disabled'}>🎲 특수 옵션 변경 — 150 G + 적철광 1</button>
 <button class="btn" onclick="forgePotion()" ${save.potionMax<6&&save.gold>=potCost()?'':'disabled'}>🧪 물약 주머니 확장 (${save.potionMax}→${Math.min(6,save.potionMax+1)}) — ${potCost()} G</button>
 <button class="btn" onclick="forgeOre()" ${save.gold>=300?'':'disabled'}>⛏️ 적철광 구매 — 300 G</button></div></div>
 <div class="card" style="width:330px"><div class="sec" style="margin-top:0">보유 무기</div>${list}<div class="muted" style="margin-top:10px;line-height:1.6">등급: 일반 → 고급 → 희귀 → 영웅 → 전설<br>강화 한도에 도달하면 승급할 수 있습니다.<br>적철광은 정예·보스 처치와 유물 보상으로 얻습니다.<br>강화 실패나 파괴는 없습니다.</div></div></div></div>`);
}
function forgeUp(){const w=save.weapons[save.cls];if(w.p>=GRADES[w.g].max||save.gold<upCost(w))return;save.gold-=upCost(w);w.p++;sfx('heavy');toast(`⚒️ 강화 성공! +${w.p}`);writeSave(true);showForge();}
function forgePromo(){const w=save.weapons[save.cls],pc=promoCost(w);if(w.g>=4||w.p<GRADES[w.g].max||save.gold<pc.gold||save.ore<pc.ore)return;save.gold-=pc.gold;save.ore-=pc.ore;w.g++;sfx('level');toast(`⬆️ ${GRADES[w.g].n} 등급으로 승급!`);writeSave(true);showForge();}
function forgeOpt(){const w=save.weapons[save.cls];if(save.gold<150||save.ore<1)return;save.gold-=150;save.ore--;const o=pick(OPTS);w.opt={k:o.k,v:Math.round(o.base*(1+w.g*0.5)*rand(0.8,1.2)*1000)/1000};sfx('select');toast(`🎲 ${o.name} +${(w.opt.v*100).toFixed(1)}%`);writeSave(true);showForge();}
function forgePotion(){if(save.potionMax>=6||save.gold<potCost())return;save.gold-=potCost();save.potionMax++;sfx('level');writeSave(true);showForge();}
function forgeOre(){if(save.gold<300)return;save.gold-=300;save.ore++;sfx('coin');writeSave(true);showForge();}

/* ===================== 38. 캠페인 · 도감 · 기록 ===================== */
function showCampaign(){
 G.back=showHub;
 const list=STORY.map((s,i)=>{const lock=i>save.chapter,done=i<save.chapter;
  return`<div class="card ${lock?'lock':''}"><div class="row" style="justify-content:space-between"><div><div class="ct">제${i+1}장 · ${s.title} ${done?'<span style="color:#6dff8a">✔ 클리어</span>':''}</div><div class="kv">${s.desc}</div><div class="kv muted">보스: ${BOSSES[i].name} · 보상: ${done?'재도전 보상 30%':s.reward}</div></div><button class="btn ${lock?'':'gold'}" ${lock?'disabled':''} onclick="startChapter(${i})">${lock?'🔒 잠김':done?'다시 하기':'출격'}</button></div></div>`;}).join('');
 setUI(`<div class="scr"><div class="hdr"><h2>📜 스토리 캠페인</h2><div class="row"><button class="btn" onclick="setUI('');showDialog(PROLOGUE,showCampaign)">프롤로그 다시 보기</button><button class="btn" onclick="showHub()">← 거점</button></div></div><div class="scroll col" style="flex:1">${list}</div></div>`);

function showCodex(tab){
 G.back=showHub;tab=tab||'enemy';let body='';
 if(tab==='enemy')body=Object.keys(ENEMIES).filter(k=>!ENEMIES[k].noCodex).map(k=>{const D=ENEMIES[k],kn=save.codex[k];return`<div class="card"><div class="ct">${kn?D.name:'???'}</div><div class="kv">${kn?D.desc:'아직 처치하지 않은 적입니다.'}</div>${kn?`<div class="kv muted">기본 HP ${D.hp} · 공격 ${D.atk}</div>`:''}</div>`;}).join('');
 else if(tab==='boss')body=BOSSES.map((B,i)=>{const kn=save.codex['boss'+i];return`<div class="card"><div class="muted">제${i+1}장 · ${B.title}</div><div class="ct">${kn?B.name:'???'}</div><div class="kv">${kn?B.desc:'아직 쓰러뜨리지 않은 보스입니다.'}</div>${kn?`<div class="kv muted">HP ${B.hp} · 패턴 ${B.patterns.length}종</div>`:''}</div>`;}).join('');
 else if(tab==='class')body=Object.keys(CLASSES).map(k=>{const C=CLASSES[k];return`<div class="card"><div class="ct">${C.icon} ${C.name} <span class="muted">${C.role}</span></div><div class="kv">${C.desc}</div><div class="kv" style="color:#ffd77a">${C.skill.name}</div>${Object.values(STYLES[k]).map(s=>`<div class="kv" style="color:${s.col}">${s.icon} ${s.name} — ${s.ult.name}</div>`).join('')}</div>`;}).join('');
 else body=RELICS.map(r=>`<div class="card"><div class="ct" style="color:${RAR[r.rar].col}">${r.icon} ${r.name}</div><div class="kv">${r.desc}</div><div class="kv muted">${RAR[r.rar].n}${r.instant?' · 즉시 효과':''}</div></div>`).join('');
 const tb=(t,n)=>`<button class="btn sm ${tab===t?'gold':''}" onclick="showCodex('${t}')">${n}</button>`;
 const ec=Object.keys(ENEMIES).filter(k=>!ENEMIES[k].noCodex),cnt=ec.filter(k=>save.codex[k]).length,bc=BOSSES.filter((b,i)=>save.codex['boss'+i]).length;
 setUI(`<div class="scr"><div class="hdr"><h2>📖 도감</h2><div class="row">${tb('enemy','적')}${tb('boss','보스')}${tb('class','직업 · 유파')}${tb('relic','유물')}<button class="btn" onclick="showHub()">← 거점</button></div></div><div class="muted" style="margin-bottom:6px">발견한 적 ${cnt}/${ec.length} · 쓰러뜨린 보스 ${bc}/${BOSSES.length}</div><div class="scroll" style="flex:1"><div class="grid3">${body}</div></div></div>`);
}
function showRecords(){
 G.back=showHub;const r=save.rec;
 const rows=[['총 플레이 시간',fmtT(r.time)],['탐험 횟수',r.runs],['사망',r.deaths],['처치한 적',r.kills.toLocaleString()],['준 피해',Math.round(r.dmg).toLocaleString()],['패링 성공',r.parries],['보스 격파',r.bosses],['원정 최고 층',r.bestFloor+' / 5'],['무한 서바이벌 최고 웨이브',r.bestWave],['캠페인 진행',save.chapter+' / 5장'],['칭호',save.title||'-']];
 setUI(`<div class="scr"><div class="hdr"><h2>📊 전투 기록</h2><button class="btn" onclick="showHub()">← 거점</button></div><div class="card" style="width:520px;align-self:center"><table class="rec">${rows.map(x=>`<tr><td>${x[0]}</td><td style="text-align:right"><b>${x[1]}</b></td></tr>`).join('')}</table></div></div>`);

/* ===================== 39. 설정 · 키 변경 · 조작법 ===================== */

 if(back)setBack=back;G.back=closeSettings;const s=save.settings;
 const tg=(k,n)=>`<div class="opt"><span>${n}</span><button class="btn sm ${s[k]?'gold':''}" onclick="togSet('${k}')">${s[k]?'켜짐':'꺼짐'}</button></div>`;
 const keys=Object.keys(DEFAULT_KEYS).map(a=>`<div class="keyrow"><span>${ACTION_LABELS[a]}</span><button class="btn sm" onclick="startRebind('${a}')">${rebinding===a?'키 입력…':keyName(s.keys[a])}${ALT_KEYS[a]?` <span class="muted">/ ${keyName(ALT_KEYS[a])}</span>`:''}</button></div>`).join('');
 place(`<div class="scr"><div class="hdr"><h2>⚙️ 환경 설정</h2><button class="btn" onclick="closeSettings()">← 돌아가기</button></div><div class="row scroll" style="flex:1;align-items:flex-start;gap:16px">

 <div class="opt"><span>음량</span><input type="range" min="0" max="1" step="0.05" value="${s.volume}" oninput="save.settings.volume=+this.value"></div>
 ${G.scene!=='play'?'<div class="sec">데이터</div><button class="btn red" onclick="wipeSave()">🗑️ 저장 데이터 초기화</button>':''}
 <div class="muted" style="margin-top:8px">난이도는 적 체력과 받는 피해에 적용됩니다. 설정은 자동 저장됩니다.</div></div>
 <div class="card" style="flex:1"><div class="sec" style="margin-top:0">키 설정 <button class="btn sm" onclick="resetKeys()">기본값</button></div>${keys}<div class="muted" style="margin-top:6px">버튼을 누른 뒤 원하는 키를 입력하세요. 겹치는 키는 서로 맞바뀝니다.</div></div></div></div>`);
}
function closeSettings(){rebinding=null;writeSave(true);const b=setBack;setBack=null;G.back=null;(b||showHub)();}
function togSet(k){save.settings[k]=!save.settings[k];applyCrt();writeSave(true);showSettings();}
function setDiff(i){save.settings.diff=i;writeSave(true);showSettings();}
function resetKeys(){save.settings.keys=Object.assign({},DEFAULT_KEYS);writeSave(true);showSettings();}
function startRebind(a){rebinding=a;showSettings();}
function finishRebind(k){const a=rebinding;rebinding=null;if(k!=='escape'||a==='pause'){const ks=save.settings.keys,old=ks[a];for(const x in ks)if(ks[x]===k&&x!==a)ks[x]=old;ks[a]=k;}writeSave(true);showSettings();}
function wipeSave(){if(!confirm('모든 진행 상황을 삭제할까요? 되돌릴 수 없습니다.'))return;try{localStorage.removeItem(SAVE_KEY);}catch(e){}const s=save.settings;save=defaultSave();save.settings=s;toast('저장 데이터를 초기화했습니다');showSettings();}
function showControls(back){
 G.back=()=>{G.back=null;back();};const K=a=>keyName(bind(a));
 place(`<div class="scr"><div class="hdr"><h2>🎮 조작법</h2><button class="btn" onclick="G.back()">← 돌아가기</button></div><div class="row scroll" style="flex:1;align-items:flex-start;gap:14px">
 <div class="card" style="flex:1"><table class="rec">${Object.keys(DEFAULT_KEYS).map(a=>`<tr><td>${ACTION_LABELS[a]}</td><td><b>${K(a)}</b>${ALT_KEYS[a]?' / '+keyName(ALT_KEYS[a]):''}</td></tr>`).join('')}</table></div>
 <div class="card" style="flex:1;font-size:13px;line-height:1.75"><div class="sec" style="margin-top:0">전투 요령</div>
 • ${K('down')} + ${K('jump')}: 발판 아래로 내려가기<br>• 공중에서 ${K('down')} + ${K('attack')}: 낙하 강하 공격<br>
 • 적이 붉게 깜빡이면 공격 직전! ${K('parry')}로 패링하면 적이 기절합니다<br>• 화살과 마력구도 패링하면 되돌려 보낼 수 있습니다<br>
 • 패링을 쌓으면 대회전베기, 치명타를 쌓으면 이연격이 자동 발동합니다<br>• 발도류: ${K('attack')}를 길게 눌렀다 놓으면 발도술<br>
 • 철벽류·수호류: ${K('dodge')}를 누르고 있으면 방패 막기, 막는 순간 맞으면 패링<br>• 궁극기 게이지는 공격·피격·패링으로 충전됩니다<br>
 • 문 앞에서 ${K('up')}: 이동 · 상자 열기 · 신단 기도<br>• 방을 클리어하면 유물 3개 중 하나를 선택합니다</div></div></div>`);
}

/* ===================== 40. 일시정지 · 보상 · 결과 ===================== */
function runSummary(){return run?`${modeName()} · 처치 ${run.kills} · 유물 ${run.relics.length}개 · ${fmtT(run.t/60)}`:'';}
function openPause(){
 if(G.modal||!run)return;G.paused=true;G.modal='pause';
 setModal(`<div class="scr center"><h2>일시정지</h2><div class="col" style="width:290px;margin-top:14px">
 <button class="btn big gold" onclick="resumeGame()">▶ 계속하기</button>
 <button class="btn big" onclick="G.modal='set';showSettings(openPause2)">⚙️ 설정</button>
 <button class="btn big" onclick="G.modal='set';showControls(openPause2)">🎮 조작법</button>
 <button class="btn big red" onclick="abandonRun()">${G.mode==='training'?'🏠 훈련 종료':'🏳️ 포기하고 거점으로'}</button></div>
 <div class="muted" style="margin-top:12px">${runSummary()}</div></div>`);
}
function openPause2(){G.modal=null;openPause();}
function resumeGame(){G.modal=null;G.paused=false;setModal('');}
function abandonRun(){if(G.mode==='training'){goHub();return;}if(!confirm('탐험을 포기할까요? 이번 탐험의 유물이 사라집니다.'))return;showResult(false,'탐험을 포기했습니다.');}
function rollRelics(src){
 const bonus=['chest','boss','elite'].includes(src)?1:0,out=[];let g=0;
 while(out.length<3&&g++<100){const rr=Math.random(),rar=rr<0.08+bonus*0.15?2:rr<0.38+bonus*0.2?1:0;
  const pool=RELICS.filter(r=>r.rar===rar&&!out.includes(r)&&!(['wave','parryBoom','rage'].includes(r.k)&&run.relics.includes(r)));
  if(pool.length)out.push(pick(pool));}
 return out;
}
function openReward(src){
 if(!run||!P||P.dead)return;G.paused=true;G.modal='reward';rewardOpts=rollRelics(src);
 const t={room:'방 클리어 보상',elite:'정예 처치 보상',chest:'보물 상자',boss:'보스 격파 보상',wave:'웨이브 돌파 보상'}[src]||'보상';
 setModal(`<div class="scr center"><h2>🎁 ${t}</h2><div class="muted" style="margin:6px 0 16px">하나를 선택하세요 (1 / 2 / 3)</div><div class="row" style="gap:16px">${rewardOpts.map((r,i)=>{const n=run.relics.filter(x=>x===r).length;
  return`<div class="rcard" style="--rc:${RAR[r.rar].col}" onclick="pickReward(${i})"><div class="ricon">${r.icon}</div><div class="rname" style="color:${RAR[r.rar].col}">${r.name}</div><div class="rrar">${RAR[r.rar].n}${r.instant?' · 즉시 효과':' · 유물'}</div><div class="rdesc">${r.desc}</div>${n?`<div class="muted sm">보유 ${n}개 · 중첩</div>`:''}<kbd>${i+1}</kbd></div>`;}).join('')}</div></div>`);
}
function pickReward(i){
 const r=rewardOpts&&rewardOpts[i];if(!r)return;rewardOpts=null;sfx('select');
 if(r.instant){if(r.instant==='potion')P.potions++;else if(r.instant==='heal')healP(P.maxHp*0.4);else if(r.instant==='gold')gainGold(120);else if(r.instant==='ore')save.ore+=2;}
 else{run.relics.push(r);run.mods[r.k]=(run.mods[r.k]||0)+r.v;if(r.k==='hp')P.hp+=r.v;}
 toast(`${r.icon} ${r.name} 획득!`);writeSave(true);G.modal=null;G.paused=false;setModal('');
}
function completeChapter(c){
 const S=STORY[c];let msg;
 if(c>=save.chapter){save.chapter=c+1;save.gold+=S.gold;msg=`제${c+1}장 클리어! 보상: ${S.reward}`;
  if(c===0)save.unlocked.dual=true;if(c===1)save.unlocked.mage=true;if(c===4)save.title='검성';}
 else{const g=Math.round(S.gold*0.3);save.gold+=g;msg=`제${c+1}장 재클리어 — ${g} G`;}
 writeSave(true);return msg;
}
function onBossDefeated(){
 writeSave(true);
 if(run.mode==='campaign'){const c=run.chapter;G.after={t:110,fn:()=>showDialog(STORY[c].outro,()=>showResult(true,completeChapter(c)))};}
 else if(run.mode==='expedition'){
  save.rec.bestFloor=Math.max(save.rec.bestFloor,run.floor);
  if(run.floor>=5)G.after={t:110,fn:()=>showResult(true,'🏆 원정 완주! 검의 종착지까지 돌파했습니다.')};
  else G.after={t:90,fn:()=>{addExitDoor('다음 층으로');openReward('boss');toast(`🚪 출구가 열렸습니다 — 문 앞에서 ${keyName(bind('up'))}`);}};
 }
}
function onExitDoor(){if(!run)return;if(run.mode==='expedition'&&run.floor<5)nextFloor();else showResult(true,'');}
function onPlayerDeath(){
 if(G.mode!=='training')save.rec.deaths++;
 if(run&&run.mode==='expedition')save.rec.bestFloor=Math.max(save.rec.bestFloor,run.floor-1);
 addFx({kind:'banner',txt:'쓰러졌다…',col:'#ff5a6a',life:100});writeSave(true);
 G.after={t:100,fn:()=>showResult(false)};
}
function showResult(win,msg){
 if(!run)return;G.paused=true;G.modal='result';$('touch').style.display='none';$('train').style.display='none';
 if(run.mode==='endless')save.rec.bestWave=Math.max(save.rec.bestWave,run.wave);
 writeSave(true);
 const r=run,prog=r.mode==='expedition'?`${r.floor}층 / 5층`:r.mode==='campaign'?`제${r.chapter+1}장 · ${STORY[r.chapter].title}`:r.mode==='endless'?`${r.wave} 웨이브`:'-';
 setModal(`<div class="scr center"><h2 style="font-size:30px;color:${win?'#ffd77a':'#ff5a6a'}">${win?'승 리':'패 배'}</h2><div class="muted" style="margin:6px 0 14px">${msg||(win?'':'검이 부러졌다… 하지만 검의 길은 끝나지 않았다.')}</div>
 <div class="card" style="width:460px"><table class="rec"><tr><td>모드</td><td>${modeName()}</td></tr><tr><td>진행</td><td>${prog}</td></tr><tr><td>처치</td><td>${r.kills}</td></tr><tr><td>준 피해</td><td>${Math.round(r.dmg).toLocaleString()}</td></tr><tr><td>획득 골드 · 경험치</td><td>${r.gold} G · ${r.xp} XP</td></tr><tr><td>레벨</td><td>${r.startLevel} → ${save.level}</td></tr><tr><td>탐험 시간</td><td>${fmtT(r.t/60)}</td></tr><tr><td>유물</td><td>${r.relics.map(x=>x.icon).join(' ')||'-'}</td></tr></table></div>
 <div class="muted sm" style="margin-top:8px">골드 · 경험치 · 적철광은 영구 보존되고, 유물은 이번 탐험에서만 유지됩니다.</div>
 <button class="btn big gold" style="margin-top:14px" onclick="goHub()">⛩️ 거점으로 (Enter)</button></div>`);
}
function goHub(){run=null;P=null;enemies=[];projs=[];parts=[];nums=[];fx=[];drops=[];G.mode=null;G.after=null;G.paused=false;G.modal=null;rewardOpts=null;dlg=null;writeSave(true);showHub();}

/* ===================== 41. 플레이 UI · 훈련장 패널 ===================== */
function uiPlay(){
 setUI('');setModal('');G.modal=null;G.back=null;
 $('touch').style.display=isTouch?'block':'none';
 if(G.mode==='training'){$('train').style.display='block';refreshTrain();}else $('train').style.display='none';
}
function refreshTrain(){
 const SS=STYLES[save.cls];
 $('train').innerHTML=`<div class="card tp"><div class="tsec" style="margin-top:0">🎯 훈련장</div><div>DPS <b id="dpsv">0</b> · 누적 <span id="dpss">0</span></div>
 <div class="tsec">직업</div><div class="tgrid">${Object.keys(CLASSES).filter(k=>save.unlocked[k]).map(k=>`<button class="btn sm ${save.cls===k?'gold':''}" onclick="trClass('${k}')">${CLASSES[k].icon}${CLASSES[k].name}</button>`).join('')}</div>
 <div class="tsec">유파</div><div class="tgrid">${Object.keys(SS).map(k=>`<button class="btn sm ${save.style[save.cls]===k?'gold':''}" onclick="trStyle('${k}')">${SS[k].icon}${SS[k].name}</button>`).join('')}</div>
 <div class="tsec">소환</div><div class="tgrid">${['dummy','sparring','slime','skeleton','archer','bat','oni','caster','fallen'].map(k=>`<button class="btn sm" onclick="trSpawn('${k}')">${ENEMIES[k].name.replace('수련용 ','')}</button>`).join('')}<button class="btn sm" onclick="trBoss()">보스</button><button class="btn sm red" onclick="trClear()">적 제거</button></div>
 <div class="tsec">도우미</div><div class="tgrid"><button class="btn sm ${G.trainInv?'gold':''}" onclick="G.trainInv=!G.trainInv;refreshTrain()">무적 ${G.trainInv?'ON':'OFF'}</button><button class="btn sm" onclick="P.skillCd=0;P.dodgeCd=0;toast('쿨타임 초기화')">쿨 초기화</button><button class="btn sm" onclick="P.ultG=100;toast('궁극기 충전')">궁극기 충전</button><button class="btn sm" onclick="resetDps();refreshTrainDps()">DPS 리셋</button></div>
 <div class="muted sm" style="margin-top:4px">${keyName(bind('pause'))} → 훈련 종료 · 대련 목인으로 패링 연습</div></div>`;
}
function refreshTrainDps(){const d=G.dps,el=$('dpsv');if(!el)return;const sec=Math.max(1,(d.last-d.start)/60);el.textContent=d.sum?Math.round(d.sum/sec):0;$('dpss').textContent=Math.round(d.sum).toLocaleString();}
function trClass(k){if(!save.unlocked[k]||!P)return;save.cls=k;cancelAttack();P.sk=null;P.ul=null;P.st=calcStats();P.maxHp=P.st.maxHp;P.hp=P.maxHp;writeSave(true);refreshTrain();toast(`${CLASSES[k].icon} ${CLASSES[k].name}(으)로 변경`);}
function trStyle(k){if(!P)return;save.style[save.cls]=k;cancelAttack();writeSave(true);refreshTrain();toast(`${STYLES[save.cls][k].icon} ${STYLES[save.cls][k].name}`);}
function trSpawn(k){if(P)spawnEnemy(k,clamp(cxOf(P)+P.face*260,60,G.roomW-60));}
function trBoss(){if(!P||enemies.some(e=>e.boss))return;spawnBoss(randi(0,BOSSES.length-1));}
function trClear(){for(const e of enemies)if(e.ai!=='dummy')e.dead=true;projs=[];}

/* ===================== 42. 터치 조작 ===================== */
function buildTouch(){
 const b=(a,l)=>`<button class="tb" data-a="${a}">${l}</button>`;
 $('touch').innerHTML=`<div class="tpad l">${b('left','◀')}${b('right','▶')}${b('up','▲')}${b('down','▼')}</div><div class="tpad r">${b('potion','물약')}${b('ult','궁극')}${b('skill','스킬')}${b('parry','패링')}${b('dodge','회피')}${b('jump','점프')}${b('attack','공격')}</div><button class="tpause" data-a="pause">❚❚</button>`;
 $('touch').querySelectorAll('[data-a]').forEach(el=>{
  const a=el.dataset.a;
  const on=e=>{e.preventDefault();initAudio();if(a==='pause'){onKeyMenu('escape');return;}touch[a]=true;touchHit[a]=true;};
  const off=e=>{e.preventDefault();touch[a]=false;};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);
 });
}

/* ===================== 43. 메뉴 키 처리 ===================== */
function onKeyMenu(k){
 const isPause=k===bind('pause')||k==='escape'||k===ALT_KEYS.pause;
 if(G.scene==='title'){showMenu();return true;}
 if(G.modal==='dialog'){if([' ','enter','j','z'].includes(k)||k===bind('attack'))advDialog();else if(isPause)skipDialog();return true;}
 if(G.modal==='reward'){if(['1','2','3'].includes(k))pickReward(+k-1);return true;}
 if(G.modal==='result'){if(k==='enter'||k===' ')goHub();return true;}
 if(G.scene==='play'){
  if(isPause){if(G.modal==='pause')resumeGame();else if(G.modal==='set'&&G.back)G.back();else if(!G.modal)openPause();return true;}
  return !!G.modal;
 }
 if(isPause&&G.back){G.back();return true;}
 return false;
}

/* ===================== 44. 메인 루프 · 초기화 ===================== */
let lastT=performance.now(),acc=0,slowTog=false;
function frame(){
 G.menuT++;
 for(const p of menuPetals){p.x+=p.vx;p.y+=p.vy;p.a+=0.03;if(p.y>H){p.y=-8;p.x=rand(0,W);}if(p.x<-10)p.x=W;if(p.x>W+10)p.x=0;}
 if(G.scene==='play'&&run&&P&&!G.paused&&!G.modal){
  if(G.hitstop>0)G.hitstop--;
  else if(G.slow>0){G.slow--;slowTog=!slowTog;if(slowTog)updateWorld();}
  else updateWorld();
  save.rec.time+=1/60;
  if(G.after&&--G.after.t<=0){const f=G.after.fn;G.after=null;f();}
  if(G.mode==='training'&&G.menuT%15===0)refreshTrainDps();
 }
 for(const k in keyHit)delete keyHit[k];
 for(const k in touchHit)delete touchHit[k];
}
function loop(now){
 acc+=Math.min(100,now-lastT);lastT=now;let n=0;
 while(acc>=1000/60&&n<4){acc-=1000/60;frame();n++;}
 if(n>=4)acc=0;
 render();requestAnimationFrame(loop);
}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('stage').style.transform=`scale(${s})`;}
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.scene==='play'&&!G.modal)openPause();});
document.head.insertAdjacentHTML('beforeend','<style>@keyframes blink{50%{opacity:.25}}</style>');
loadSave();applyCrt();buildTouch();fit();showTitle();requestAnimationFrame(loop);
</script>
</body>
</html>
