function physics(o,noGrav){
 if(!noGrav)o.vy=Math.min(o.vy+GRAV,18);

 const prevB=o.y+o.h;o.y+=o.vy;o.ground=false;o.onPlat=false;
 if(o.vy>=0){for(const p of plats){
  if(o.x+o.w<=p.x||o.x>=p.x+p.w)continue;
  if(p.oneway&&o.dropT>0)continue;
  if(prevB<=p.y+1&&o.y+o.h>=p.y){o.y=p.y-o.h;o.vy=0;o.ground=true;o.onPlat=!!p.oneway;break;}
 }}
 if(o.y+o.h>FLOOR){o.y=FLOOR-o.h;o.vy=0;o.ground=true;o.onPlat=false;}
}

/* ===================== 22. 던전 생성 (BFS 연결 검증) ===================== */
function genFloor(seed,nRooms){
 const R=mulberry(seed),rooms=[],grid={},key=(x,y)=>x+','+y;
 const add=(gx,gy)=>{const r={id:rooms.length,gx,gy,type:'combat',doors:{},cleared:false,visited:false,looted:false,seed:Math.floor(R()*1e9)};rooms.push(r);grid[key(gx,gy)]=r;return r;};
 add(0,0);
 const dirs=[[1,0,'r','l'],[-1,0,'l','r'],[0,-1,'u','d'],[0,1,'d','u']];
 let guard=0;
 while(rooms.length<nRooms&&guard++<800){
  const base=rooms[Math.floor(R()*rooms.length)];
  const d=R()<0.7?(R()<0.75?dirs[0]:dirs[1]):dirs[2+Math.floor(R()*2)];
  const nx=base.gx+d[0],ny=base.gy+d[1];
  if(Math.abs(ny)>2||nx<-2||grid[key(nx,ny)])continue;
  const n=add(nx,ny);base.doors[d[2]]=n.id;n.doors[d[3]]=base.id;
 }
 const dA=rooms.map(()=>-1);dA[0]=0;const q=[0];
 while(q.length){const c=q.shift();for(const k in rooms[c].doors){const t=rooms[c].doors[k];if(dA[t]<0){dA[t]=dA[c]+1;q.push(t);}}}
 rooms.forEach((r,i)=>r.dist=dA[i]);
 if(rooms.some(r=>r.dist<0))return genFloor(seed+1,nRooms);
 rooms[0].type='start';rooms[0].cleared=true;
 const order=rooms.slice(1).sort((a,b)=>b.dist-a.dist);
 const boss=order.find(r=>Object.keys(r.doors).length===1)||order[0];boss.type='boss';
 const rest=order.filter(r=>r!==boss);
 for(let i=rest.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
 if(rest[0])rest[0].type='treasure';
 if(rest[1])rest[1].type='shrine';
 let el=nRooms>7?2:1;
 for(const r of rest.slice(2))if(el>0&&r.dist>=2){r.type='elite';el--;}
 for(const r of rooms)if(r.type==='treasure'||r.type==='shrine')r.cleared=true;
 return rooms;
}

 G.roomW=['boss','start','treasure','shrine'].includes(r.type)?W:(R()<0.55?1440:1200);
 const RW=G.roomW,T1=FLOOR-112,T2=FLOOR-205,T3=FLOOR-298,mid=RW/2;
 const hasU=r.doors.u!==undefined,hasD=r.doors.d!==undefined;
 plats=[{x:0,y:FLOOR,w:RW,h:H-FLOOR,oneway:false}];doors=[];props=[];
 if(r.type==='boss'){plats.push({x:120,y:T1,w:160,h:14,oneway:true},{x:RW-280,y:T1,w:160,h:14,oneway:true},{x:mid-90,y:T2,w:180,h:14,oneway:true});}
 else{let x=110+R()*60,i=0;while(x<RW-220){const w=130+R()*80;if(!(hasU&&Math.abs(x+w/2-mid)<240)){plats.push({x,y:T1,w,h:14,oneway:true});if(i%2===1&&R()<0.7)plats.push({x:x+60,y:T2,w:120+R()*50,h:14,oneway:true});}x+=w+110+R()*120;i++;}}
 if(hasU){plats.push({x:mid-230,y:T1,w:130,h:14,oneway:true},{x:mid+100,y:T2,w:130,h:14,oneway:true},{x:mid-90,y:T3,w:180,h:14,oneway:true});doors.push({x:mid-24,y:T3-76,w:48,h:76,dir:'u',to:r.doors.u});}
 if(hasD)doors.push({x:mid-24,y:FLOOR-76,w:48,h:76,dir:'d',to:r.doors.d});
 if(r.doors.l!==undefined)doors.push({x:0,y:FLOOR-96,w:34,h:96,dir:'l',to:r.doors.l});
 if(r.doors.r!==undefined)doors.push({x:RW-34,y:FLOOR-96,w:34,h:96,dir:'r',to:r.doors.r});
 const px=mid+(hasD?140:0);
 if(r.type==='treasure')props.push({kind:'chest',x:px-24,y:FLOOR-34,w:48,h:34,used:r.looted});
 if(r.type==='ruin'&&r.cleared)props.push({kind:'rchest',x:px-24,y:FLOOR-34,w:48,h:34,used:r.looted});if(r.type==='shrine')props.push({kind:'shrine',x:px-26,y:FLOOR-90,w:52,h:90,used:r.looted});

  if(e.elite)save.ore++;

  if(e.boss)save.ore+=2+e.idx;lootOnKill(e);

 }else sfx('hit');

/* ===================== 27. 투사체 ===================== */
function explodeProj(p){
 const cx=cxOf(p),cy=cyOf(p),r=p.explode;
 addFx({kind:'ring',x:cx,y:cy,r:8,max:r,col:p.col,life:14});burst(cx,cy,p.col,14,5);sfx('boom');shake(4);
 if(p.friend){for(const e of enemies)if(!e.dead&&!p.hit.has(e)&&Math.hypot(cxOf(e)-cx,cyOf(e)-cy)<r+e.w/2){p.hit.add(e);damageEnemy(e,p.dmg*0.8,{kb:6,burn:p.burn||0,col:p.col,noStack:true,ultMul:0.3});}}
 else if(Math.hypot(cxOf(P)-cx,cyOf(P)-cy)<r)hurtPlayer(p.dmg,p);
}
function updateProjs(){
 for(const p of projs){
  if(p.dead)continue;
  if(p.delay>0){p.delay--;continue;}
  p.life--;p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=p.grav;
  if(p.life<=0){if(p.explode)explodeProj(p);p.dead=true;continue;}
  if(p.x<-120||p.x>G.roomW+120||p.y>H+40){p.dead=true;continue;}
  if(p.explode&&p.y+p.h>=FLOOR){explodeProj(p);p.dead=true;continue;}
  if((p.kind==='rarrow'||(!p.friend&&p.kind==='rock'))&&p.y+p.h>=FLOOR){burst(cxOf(p),FLOOR,p.col,10,3,{up:2});p.dead=true;continue;}
  if(p.friend){
   const cx=cxOf(p),cy=cyOf(p);
   if(p.pull)for(const e of enemies)if(!e.dead&&!e.boss&&e.ai!=='dummy'&&Math.abs(cxOf(e)-cx)<140&&Math.abs(cyOf(e)-cy)<120)e.vx+=Math.sign(cx-cxOf(e))*0.6;
   for(const e of enemies){
    if(e.dead||!ov(p,e))continue;
    if(p.rehit){p.hm=p.hm||new Map();if(G.t-(p.hm.get(e)||-999)<p.rehit)continue;p.hm.set(e,G.t);}
    else{if(p.hit.has(e))continue;p.hit.add(e);}
    damageEnemy(e,p.dmg,{kb:p.kb||3,dir:Math.sign(p.vx)||1,burn:p.burn||0,col:p.col,noStack:true,ultMul:0.5});if(p.onHit)p.onHit(e,p);
    if(p.explode){explodeProj(p);p.dead=true;break;}
    if(!p.pierce){p.dead=true;break;}
   }
  }else if(ov(p,P)){
   const r=hurtPlayer(p.dmg,p);
   if(r&&!p.persist&&!p.friend)p.dead=true;
  }
 }
 projs=projs.filter(p=>!p.dead);
}

/* ===================== 28. 방 클리어 · 웨이브 · 월드 업데이트 ===================== */
function startWave(){
 run.wave++;run.waveActive=true;run.theme=Math.floor((run.wave-1)/5)%5;run.scale=1+(run.wave-1)*0.09;
 if(run.wave%5===0)spawnBoss((run.wave/5-1)%5);
 else{const n=Math.min(10,2+run.wave);for(let i=0;i<n;i++)spawnEnemy(pick(POOLS[run.theme]),spawnX(180),{elite:run.wave>6&&Math.random()<0.15});}
 addFx({kind:'banner',txt:`웨이브 ${run.wave}${run.wave%5===0?' — 보스 출현!':''}`,col:'#ff7a7a',life:80});
}
function checkClear(){
 if(!run||P.dead)return;
 const alive=enemies.some(e=>!e.dead&&e.ai!=='dummy');
 if(run.rooms){
  const r=run.rooms[run.cur];
  if(!r.cleared&&!alive){
   r.cleared=true;
   if(r.type==='boss')onBossDefeated();
   else{sfx('level');addFx({kind:'banner',txt:'방 클리어!',col:'#ffd77a',life:60});writeSave();
    if(r.type==='ruin')ruinCleared();if(r.type==='combat'||r.type==='elite')G.after={t:45,fn:()=>openReward(r.type==='elite'?'elite':'room')};}
  }
 }else if(G.mode==='endless'){
  if(run.waveActive&&!alive){
   run.waveActive=false;save.rec.bestWave=Math.max(save.rec.bestWave,run.wave);writeSave(true);
   addFx({kind:'banner',txt:`${run.wave} 웨이브 돌파!`,col:'#ffd77a',life:70});G.waveT=150;
   if(run.wave%3===0)G.after={t:50,fn:()=>openReward('wave')};
  }else if(!run.waveActive&&--G.waveT<=0)startWave();
 }
}
function updateWorld(){
 G.t++;if(run)run.t++;
 updatePlayer();
 for(const e of enemies)if(!e.dead)updateEnemy(e);
 updateProjs();updateDrops();updateAllies();
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.96;p.life--;if(p.petal){p.rot+=p.vr||0.1;p.vx+=Math.sin(p.life*0.15)*0.05;}}
 parts=parts.filter(p=>p.life>0);if(parts.length>600)parts.splice(0,parts.length-600);
 for(const n of nums){n.y-=0.9;n.life--;}nums=nums.filter(n=>n.life>0);
 for(const f of fx)f.t++;fx=fx.filter(f=>f.t<f.life);
 enemies=enemies.filter(e=>!e.dead);
 checkClear();
 updateEnv();
 if(G.mode==='pvp')netTick();
 G.shake*=0.86;if(G.shake<0.3)G.shake=0;
 if(G.flash&&--G.flash.t<=0)G.flash=null;
}

   case'storm':for(let i=0;i<10;i++){const an=f.t*0.25+i*0.628,r=70+Math.sin(f.t*0.1+i)*14,x=cxOf(P)+Math.cos(an)*r,y=cyOf(P)+Math.sin(an)*r*0.7;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(an+1.6)*16,y+Math.sin(an+1.6)*16);ctx.stroke();}break;

   case'gshock':{const r=f.max*Math.min(1,f.t/f.life*1.4);ctx.lineWidth=4*a+1;ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*0.18,0,0,7);ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(f.x,f.y,r*0.6,r*0.11,0,0,7);ctx.stroke();break;}
   case'sidering':{const d=f.max*(f.t/f.life);for(const s2 of[-1,1]){ctx.lineWidth=5*a+1;ctx.beginPath();ctx.ellipse(f.x+s2*d,f.y-16,10+6*a,24,0,s2>0?-1.6:1.6,s2>0?1.6:4.7);ctx.stroke();}break;}

   case'tline':{const pul=0.5+0.5*Math.sin(f.t*0.5);ctx.globalAlpha=Math.min(1,(f.life-f.t)/8)*(0.35+0.4*pul);ctx.fillStyle=f.col;for(let x=0;x<f.len;x+=18)ctx.fillRect(f.x+f.dir*x-(f.dir<0?12:0),f.y-3,12,4);ctx.beginPath();const ex=f.x+f.dir*f.len;ctx.moveTo(ex,f.y-12);ctx.lineTo(ex+f.dir*18,f.y-1);ctx.lineTo(ex,f.y+10);ctx.fill();break;}
   case'tmark':{const pul=0.5+0.5*Math.sin(f.t*0.45),r=f.r*(0.85+0.15*pul);ctx.globalAlpha=Math.min(1,(f.life-f.t)/8)*(0.5+0.4*pul);ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*0.22,0,0,7);ctx.stroke();ctx.globalAlpha*=0.35;ctx.fill();ctx.globalAlpha=0.9;ctx.fillRect(f.x-1,f.y-r*0.6,2,r*0.5);break;}
   case'tring':{const r=f.r*(1-f.t/f.life)+10;ctx.globalAlpha=0.25+0.5*f.t/f.life;ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.stroke();ctx.setLineDash([]);break;}

function showForge(){

 setUI(`<div class="scr"><div class="hdr"><h2>🔨 대장간</h2><div class="row"><span>💰 ${save.gold.toLocaleString()} G · 🪨 ${save.ore}</span><button class="btn" onclick="showHub()">← 거점</button></div></div>

 <div class="kv">무기 배율 x${weaponMul(c).toFixed(2)} · 강화 한도 +${gr.max}</div><div class="kv">특수 옵션: ${opt}</div>
 <div class="col" style="margin-top:12px">
 <button class="btn gold" onclick="forgeUp()" ${w.p<gr.max&&save.gold>=upCost(w)?'':'disabled'}>⚒️ 강화 +${w.p+1} — ${upCost(w)} G${w.p>=gr.max?' (한도 도달 · 승급 필요)':''}</button>
 <button class="btn" onclick="forgePromo()" ${nx&&w.p>=gr.max&&save.gold>=pc.gold&&save.ore>=pc.ore?'':'disabled'}>⬆️ 승급 → ${nx?nx.n:'최고 등급'} — ${pc.gold} G + 적철광 ${pc.ore}</button>
 <button class="btn" onclick="forgeOpt()" ${save.gold>=150&&save.ore>=1?'':'disabled'}>🎲 특수 옵션 변경 — 150 G + 적철광 1</button>
 <button class="btn" onclick="forgePotion()" ${save.potionMax<6&&save.gold>=potCost()?'':'disabled'}>🧪 물약 주머니 확장 (${save.potionMax}→${Math.min(6,save.potionMax+1)}) — ${potCost()} G</button>
 <button class="btn" onclick="forgeOre()" ${save.gold>=300?'':'disabled'}>⛏️ 적철광 구매 — 300 G</button></div></div>
 <div class="card" style="width:330px"><div class="sec" style="margin-top:0">보유 무기</div>${list}<div class="muted" style="margin-top:10px;line-height:1.6">등급: 일반 → 고급 → 희귀 → 영웅 → 전설<br>강화 한도에 도달하면 승급할 수 있습니다.<br>적철광은 정예·보스 처치와 유물 보상으로 얻습니다.<br>강화 실패나 파괴는 없습니다.</div></div></div></div>`);
}
function forgeUp(){const w=save.weapons[save.cls];if(w.p>=GRADES[w.g].max||save.gold<upCost(w))return;save.gold-=upCost(w);w.p++;sfx('heavy');toast(`⚒️ 강화 성공! +${w.p}`);writeSave(true);showForge();}
function forgePromo(){const w=save.weapons[save.cls],pc=promoCost(w);if(w.g>=4||w.p<GRADES[w.g].max||save.gold<pc.gold||save.ore<pc.ore)return;save.gold-=pc.gold;save.ore-=pc.ore;w.g++;sfx('level');toast(`⬆️ ${GRADES[w.g].n} 등급으로 승급!`);writeSave(true);showForge();}

/* ===================== 45. v3 확장: 전투 보조 · 유파 메커니즘 ===================== */
const GLOWS={fire:{n:'화염 붉은색',col:'#ff4a3a'},holy:{n:'성광 황금색',col:'#ffd34d'},abyss:{n:'심연 보라색',col:'#a04dff'},sakura:{n:'벚꽃 분홍색',col:'#ff9ccf'},azure:{n:'청백 검광',col:'#9fe0ff'},blood:{n:'혈월 진홍',col:'#ff2040'}};
function hexRGB(h){if(typeof h!=='string'||h[0]!=='#')return[255,255,255];if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function hexA(h,a){const[r,g,b]=hexRGB(h);return`rgba(${r},${g},${b},${a})`;}
function toHex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function shade(h,amt){const[r,g,b]=hexRGB(h);return amt>=0?toHex(r+(255-r)*amt,g+(255-g)*amt,b+(255-b)*amt):toHex(r*(1+amt),g*(1+amt),b*(1+amt));}
function mixHex(a,b,t){const A=hexRGB(a),B=hexRGB(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
const easeOut=x=>1-Math.pow(1-x,3);
const _palC={};
function palFrom(base,cp){const k=base.id+'_'+cp.c+cp.d+cp.b;return _palC[k]||(_palC[k]=Object.assign({},base,{id:k,c:cp.c,d:cp.d,b:cp.b}));}
function playerPal(cls){cls=cls||save.cls;const C=CLASSES[cls],cp=save.custom.pal[cls];return cp?palFrom(C.pal,cp):C.pal;}
function bladeFor(C){const g=save.custom.glow&&GLOWS[save.custom.glow];return g?Object.assign({},C.blade,{glow:g.col}):C.blade;}
function trailCol(S){const t=save.custom.trail;if(t&&GLOWS[t])return GLOWS[t].col;return save.cls==='dual'?'#ff3fb4':S.col;}

function enemyThreat(){
 const px=cxOf(P),py=cyOf(P);
 for(const e of enemies){if(e.dead||e.ai==='dummy')continue;const d=Math.abs(cxOf(e)-px),dy=Math.abs(cyOf(e)-py);
  if(e.boss){if(d<440&&(e.tele||['combo','dash','slam','teleport','nova','phase'].includes(e.st)))return true;if(d<e.w/2+70)return true;continue;}
  if((e.st==='wind'||e.st==='dive')&&d<260)return true;
  if(e.D&&e.D.contact&&d<110&&dy<100)return true;}
 for(const p of projs){if(p.friend||p.dead)continue;
  if(p.warnX!==undefined&&Math.abs(p.warnX-px)<90)return true;
  if(p.kind==='pillar'&&Math.abs(cxOf(p)-px)<90)return true;

 return false;

/* 보스 데미지 캡(1초 창 15%) + 페이즈 경계 고정 */
function bossGate(e,dmg){
 if(e.st==='phase'||e.pendingPhase)return 0;
 const cap=e.maxHp*0.15;
 if(!e.capW||G.t-e.capW.t0>60)e.capW={t0:G.t,sum:0};
 dmg=Math.min(dmg,cap-e.capW.sum);if(dmg<=0)return 0;
 const th=[0.7,0.3][e.phase||0];
 if(th!==undefined){const fl=Math.floor(e.maxHp*th);if(e.hp-dmg<=fl){dmg=Math.max(0,e.hp-fl);e.pendingPhase=true;}}
 dmg=Math.max(0,Math.round(dmg));e.capW.sum+=dmg;return dmg;
}

/* ===================== 49. 🌐 온라인 1:1 결투 — WebRTC P2P (PeerJS) =====================
   · PeerJS는 이 메뉴에 들어갈 때만 CDN에서 동적으로 불러온다 → 싱글플레이는 여전히 외부 라이브러리 0개.
   · 피격 판정은 "맞는 쪽 권위(victim-authoritative)": 공격자는 자기 화면에서 맞췄다고 판단하면 hit 를 보내고,
     맞는 쪽이 자기 무적/회피/패링/막기 상태로 최종 판정 → 결과(res)를 돌려준다. 패링당하면 공격자가 기절. */
const PEER_SRC='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
const NET={peer:null,conn:null,host:false,code:'',remote:null,rival:null,status:'대기 중 — 방을 만들거나 코드로 참가하세요.'};
function loadPeerJS(cb){if(window.Peer){cb();return;}netStatus('PeerJS 불러오는 중…');const s=document.createElement('script');s.src=PEER_SRC;s.onload=()=>window.Peer?cb():netStatus('❌ PeerJS 초기화 실패');s.onerror=()=>netStatus('❌ PeerJS를 불러오지 못했습니다 — 인터넷 연결이나 CDN 차단을 확인하세요.');document.head.appendChild(s);}
function netStatus(m){NET.status=m;const el=$('netst');if(el)el.innerHTML=m;}
function netMe(){const S=curStyle(),pal=playerPal();return{name:save.custom.title?`〔${save.custom.title}〕`:'',lv:save.level,gender:genderOf(save.cls),cls:save.cls,style:save.style[save.cls],pal:{c:pal.c,d:pal.d,b:pal.b},glow:S.col};}
function showOnline(){

 const open=NET.conn&&NET.conn.open,R=NET.remote;
 setUI(`<div class="scr"><div class="hdr"><h2>🌐 온라인 결투 — P2P 1:1</h2><button class="btn" onclick="G.back()">← 거점 (연결 종료)</button></div>
 <div class="row" style="align-items:stretch;gap:14px">
 <div class="card" style="flex:1"><div class="sec" style="margin-top:0">방 만들기 (호스트)</div><div class="kv">방 코드를 만들어 상대에게 알려주세요.</div><button class="btn gold" style="margin-top:8px" onclick="netHost()">🏯 방 만들기</button>
 <div style="font-size:30px;letter-spacing:6px;color:#ffd77a;margin-top:10px;font-weight:900">${NET.code||'— — —'}</div>${NET.code?`<button class="btn sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${NET.code}');toast('코드 복사됨')">📋 코드 복사</button>`:''}</div>

 <div class="muted sm" style="margin-top:8px;line-height:1.6">• 게임 데이터는 중계 서버 없이 두 브라우저가 직접 주고받습니다(WebRTC). 처음 서로를 찾는 과정(시그널링)에만 PeerJS 무료 공개 서버를 씁니다.<br>
 • 결투에서는 레벨·장비·유물 대신 직업·유파 기본 능력치로 맞춰집니다. 궁극기 컷인은 상대 화면이 멈추지 않도록 생략됩니다.<br>

function netHost(){loadPeerJS(()=>{netClose(true);const code=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[randi(0,31)]).join('');NET.host=true;NET.code=code;netStatus('방 개설 중…');
 const peer=NET.peer=new Peer('swm3-'+code);
 peer.on('open',()=>{netStatus(`✅ 방 개설 완료 — 코드 <b style="color:#ffd77a">${code}</b> 를 상대에게 알려주세요.`);if(G.scene==='hub'&&$('netst'))showOnline();});
 peer.on('connection',c=>{if(NET.conn&&NET.conn.open){c.on('open',()=>c.close());return;}netBind(c);});
 peer.on('error',e=>netStatus('❌ 오류: '+(e.type||e.message||e)));});}
function netJoin(){const el=$('netcode'),code=(el?el.value:'').trim().toUpperCase();if(code.length!==6){toast('6자리 방 코드를 입력하세요');return;}
 loadPeerJS(()=>{netClose(true);NET.host=false;NET.code='';netStatus('접속 중…');const peer=NET.peer=new Peer();
 peer.on('open',()=>netBind(peer.connect('swm3-'+code,{reliable:true})));
 peer.on('error',e=>netStatus(e.type==='peer-unavailable'?'❌ 해당 코드의 방을 찾을 수 없습니다.':'❌ 오류: '+(e.type||e.message||e)));});}
function netBind(c){NET.conn=c;
 c.on('open',()=>{netStatus('🔗 상대와 연결되었습니다!');c.send({t:'hello',me:netMe()});sfx('select');if(G.scene==='hub'&&$('netst'))showOnline();});
 c.on('data',netRecv);
 c.on('close',()=>{const was=G.mode==='pvp'&&run&&P&&!P.dead&&!(NET.rival&&NET.rival.dead);NET.conn=null;NET.remote=null;netStatus('연결이 종료되었습니다.');toast('🔌 상대와의 연결이 끊어졌습니다');
  if(was){G.paused=false;G.modal=null;setModal('');G.after={t:30,fn:()=>showResult(true,'상대가 결투를 떠났습니다.')};}else if(G.scene==='hub'&&$('netst'))showOnline();});
 c.on('error',e=>netStatus('❌ 연결 오류: '+(e.type||e)));}
function netSend(o){if(NET.conn&&NET.conn.open)try{NET.conn.send(o);}catch(e){}}

/* ===================== 50. 4~5등신 리그(Rig) 도트 캐릭터 =====================
   관절(엉덩이·목·어깨·손발)을 포즈로 지정 → 2관절 IK로 팔다리를 계산 → 아트 픽셀(1px)로 그린 뒤
   외곽선을 입혀 화면에 2배(AP) 확대 출력. 포즈만 바꾸면 사선 베기·발도·찌르기 등 모든 동작이 나온다. */
const AP=1,BGAP=2,HDS=2.2;
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
const RIGC={};for(const n of[64,128,192,256])RIGC[n]={a:mkC(n),s:mkC(n),o:mkC(n)};
let RG=null;
const _shC=new Map();
function sh(c,a){if(!c||c[0]!=='#')return c;const k=c+'|'+a;let v=_shC.get(k);if(!v){v=shade(c,a);_shC.set(k,v);}return v;}
function rr(x,y,w,h,c){RG.fillStyle=c;RG.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function rline(x0,y0,x1,y1,w,c){RG.fillStyle=c;w=Math.max(1,Math.round(w));const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));const o=(w-1)/2;
 for(let i=0;i<=n;i++){const t=i/n;RG.fillRect(Math.round(x0+(x1-x0)*t-o),Math.round(y0+(y1-y0)*t-o),w,w);}}
function rpoly(pts,c){RG.fillStyle=c;let y0=1e9,y1=-1e9;for(const p of pts){if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];}
 for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const yc=y+0.5,xs=[];
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
  xs.sort((p,q)=>p-q);for(let i=0;i+1<xs.length;i+=2){const xa=Math.round(xs[i]),xb=Math.round(xs[i+1]);if(xb>xa)RG.fillRect(xa,y,xb-xa,1);}}}
function rcirc(cx,cy,r,c){RG.fillStyle=c;const R=Math.ceil(r);for(let dy=-R;dy<=R;dy++){const w=Math.sqrt(Math.max(0,r*r-dy*dy));if(w<0.35)continue;RG.fillRect(Math.round(cx-w),Math.round(cy+dy),Math.max(1,Math.round(2*w)),1);}}
function ik2(ax,ay,tx,ty,l1,l2,bend){const dx=tx-ax,dy=ty-ay,d0=Math.hypot(dx,dy)||0.01,d=Math.min(d0,l1+l2-0.05),a=Math.atan2(dy,dx),c=clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1),t=a+bend*Math.acos(c),ex=ax+Math.cos(t)*l1,ey=ay+Math.sin(t)*l1,b2=Math.atan2(ty-ey,tx-ex);return[ex,ey,ex+Math.cos(b2)*l2,ey+Math.sin(b2)*l2];}

 L.sky=up2(L.sky);for(const l of L.layers)l.c=up2(l.c);return _bgCache[i]=L;}

 for(const p of plats){ctx.save();ctx.translate(0,p.y);

function migrateSave(raw){
 const v=raw&&raw.ver||1;
 if(v<3){if(save.title==='검성'&&!save.custom.title)save.custom.title='검성';
  for(const k in save.custom.pal){const c=save.custom.pal[k];if(c&&!(c.c&&c.d&&c.b))save.custom.pal[k]=null;}}
 if(v<4){if(save.level>=5)save.jobDone=true;else{save.jobDone=false;save.cls='novice';}
  if(save.level<15)for(const k of['swordsman','knight','dual','mage'])save.style[k]='basic';}
 if(v<5){if(save.chapter>=3)save.unlocked.shaman=true;}
 save.ver=5;
 if(!STYLES[save.cls])save.cls=save.jobDone?'swordsman':'novice';
 for(const k in STYLES)if(!save.style[k]||!STYLES[k][save.style[k]])save.style[k]='basic';
}
function gainXp(n){
 n=Math.round(n);save.xp+=n;if(run)run.xp+=n;
 while(save.xp>=xpNeed(save.level)){
  save.xp-=xpNeed(save.level);save.level++;save.sp+=3;sfx('level');
  if(P&&!P.dead){P.hp=Math.min(P.maxHp,P.hp+P.maxHp*0.25);addFx({kind:'text',x:cxOf(P),y:P.y-40,txt:'LEVEL UP!',col:'#ffd77a',life:70});}
  toast(`⬆️ 레벨 ${save.level} 달성! 스탯 +3${save.level>=15?' · 스킬 트리 +1':''}`);
  if(save.level===5&&!save.jobDone)addFx({kind:'banner',txt:'🎖️ 전직 가능 — 거점의 [전직] 메뉴에서 직업을 고르세요',col:'#ffd77a',life:160});
  if(save.level===15&&save.jobDone)addFx({kind:'banner',txt:'🏯 유파 개방 — 거점의 [캐릭터 · 유파]에서 유파를 고르세요',col:'#ffd77a',life:160});
 }
}
function completeChapter(c){
 const S=STORY[c];let msg;
 if(c>=save.chapter){const s=5+c*3;save.chapter=c+1;save.gold+=S.gold;save.soul=(save.soul||0)+s;msg=`제${c+1}장 클리어! 보상: ${S.reward} + 🔮검혼석 ${s}`;
  if(c===0)save.unlocked.dual=true;if(c===1)save.unlocked.mage=true;if(c===2)save.unlocked.shaman=true;if(c===4)save.title='검성';}
 else{const g=Math.round(S.gold*0.3);save.gold+=g;msg=`제${c+1}장 재클리어 — ${g} G`;}
 writeSave(true);return msg;
}

function equippedWeapon(){const eq=save.equip&&save.equip[save.cls];if(!eq||!eq.weapon)return null;const it=itemById(eq.weapon);return it&&(!it.cls||it.cls===save.cls)?it:null;}

function eqStats(){
 const aff=CLASSES[save.cls].armor||'mid',out={},eq=(save.equip&&save.equip[save.cls])||{};let load=0;
 for(const[s]of SLOTS){const it=itemById(eq[s]);if(!it)continue;if(s==='weapon'&&it.cls&&it.cls!==save.cls)continue;load+=it.w||0;
  let mul=1;if(it.heavy===true)mul=aff==='heavy'?1.25:aff==='mid'?1.1:1;else if(it.heavy===false)mul=aff==='light'?1.25:aff==='mid'?1.1:1;
  for(const k in it.st)out[k]=(out[k]||0)+it.st[k]*mul;}
 out.load=load;out.cap=capacity();return out;
}

/* ---- 유파 파생 (검기 색 · 오의 · 특화 무기) ---- */
const _sty5={};
function applyFx(d,base,fx){
 if(fx.finMul){const n=base.combo.length;d.combo=base.combo.map((h,i)=>i===n-1?Object.assign({},h,{dmg:h.dmg*fx.finMul}):h);}
 if(fx.ultDmg)d.ult=Object.assign({},base.ult,{dmg:base.ult.dmg*fx.ultDmg});
 if(fx.dodgeCd&&base.dodge.cd)d.dodge=Object.assign({},base.dodge,{cd:Math.round(base.dodge.cd*fx.dodgeCd)});
 if(fx.parryWin)d.parryWin=base.parryWin+fx.parryWin;
 if(fx.skillCd)d.skillMod=Object.assign({},base.skillMod,{cdMul:(base.skillMod.cdMul||1)*fx.skillCd});
 if(fx.chargeMul&&base.charge)d.charge=Object.assign({},base.charge,{mul:(base.charge.mul||1)*fx.chargeMul,hit:Object.assign({},base.charge.hit,{dmg:base.charge.hit.dmg*fx.chargeMul})});
}
function applySpecial(d,sp){
 switch(sp){
  case'iaiHalf':if(d.charge&&!d.charge.shot)d.charge=Object.assign({},d.charge,{time:Math.round(d.charge.time/2)});break;
  case'chargeFast':if(d.charge&&d.charge.shot)d.charge=Object.assign({},d.charge,{time:Math.round(d.charge.time*0.6)});break;
  case'plum16':if(d.plum)d.plumN=4;break;
  case'petal4':if(d.petal)d.petalMax=4;break;
  case'chain4':d.chainN=4;break;
  case'guardSta':if(d.dodge.type==='guard')d.guardSta=0.5;break;
  case'shiki2':d.shikiN=1;break;
  case'grabBoom':d.grabBoom=true;break;
  case'saint':d.waveFin=true;break;
  case'parryBoom':d.parryBoom=true;break;
  case'pierce':d.pierceAll=true;break;
  case'void':d.ult=Object.assign({},d.ult,{dmg:d.ult.dmg*1.5});break;
 }
}
function curStyle(){
 const cls=save.cls,sk=save.style[cls]||'basic',base=(STYLES[cls]&&STYLES[cls][sk])||STYLES[cls].basic;
 const g=save.custom&&save.custom.glow,gc=g&&GLOWS[g]?GLOWS[g].col:'';
 const v9pvp=G.mode==='pvp',wi=v9pvp?null:equippedWeapon(),sp=(wi&&wi.sp)||'',og=!v9pvp&&sk!=='basic'&&treeOf(cls,sk).ougi?1:0;
 const key=cls+'|'+sk+'|'+gc+'|'+sp+'|'+og;
 let d=_sty5[key];if(d)return d;
 d=Object.create(base);if(gc)d.col=gc;
 if(og){const O=OUGI[cls+'.'+sk];if(O)applyFx(d,base,O.fx);}
 if(sp)applySpecial(d,sp);
 return _sty5[key]=d;
}

function calcStats(){
 const C=CLASSES[save.cls],S=curStyle(),st=save.stats,m=run?run.mods:{},sm=S.mod,lv=save.level-1,E=eqStats(),T=treeStats();
 const rage=m.rage&&P&&P.hp<P.maxHp*0.5?1.3:1,over=E.load>E.cap?Math.min(0.5,(E.load-E.cap)/E.cap):0;
 const r={
  maxHp:Math.round((C.hp+st.vit*12+lv*5+(m.hp||0)+(E.hp||0))*(sm.hp||1)*(1+(T.hpP||0))),
  atk:C.atk*(1+st.str*0.04+lv*0.03)*weaponMul()*(sm.atk||1)*(1+(m.atk||0))*rage*(1+(E.atk||0)+(T.atk||0)),
  crit:Math.min(0.9,0.05+st.dex*0.006+(sm.crit||0)+(m.crit||0)+wOpt('crit')+(E.crit||0)+(T.crit||0)),
  critDmg:1.6+(m.critDmg||0)+(E.critDmg||0)+(T.critDmg||0),
  spd:C.spd*(1+st.agi*0.012)*(sm.spd||1)*(1+(m.spd||0)+(E.spd||0))*(1-over),
  aspd:S.atkSpd*(1+(m.atkSpd||0)+wOpt('aspd')+(E.aspd||0))*(1-over*0.6),
  cdr:Math.min(0.6,st.agi*0.006+(m.cdr||0)+wOpt('cdr')+(E.cdr||0)+(T.cdr||0)),
  def:Math.min(0.8,st.def*0.012+(m.def||0)+(E.def||0)+(T.def||0)),
  steal:(m.steal||0)+wOpt('steal')+(E.steal||0)+(T.steal||0),
  ultGain:1+(m.ult||0)+wOpt('ult')+(E.ult||0)+(T.ult||0),
  boss:wOpt('boss')+(E.boss||0),gold:m.goldUp||0,over,load:E.load,cap:E.cap};
 if(G.mode==='pvp'){r.maxHp=Math.round(C.hp*2.6*(sm.hp||1));r.atk=C.atk*1.8*(sm.atk||1);r.crit=0.08+(sm.crit||0);r.critDmg=1.5;r.spd=C.spd*(sm.spd||1);r.aspd=S.atkSpd;r.cdr=0;r.def=0;r.steal=0;r.ultGain=0.7;r.boss=0;r.gold=0;r.over=0;}

function equippedWeaponOf(c){const eq=save.equip&&save.equip[c],it=eq&&itemById(eq.weapon);return it&&(!it.cls||it.cls===c)?it:null;}
function rollOpt(g){const o=pick(OPTS);return{k:o.k,v:Math.round(o.base*(1+g*0.5)*rand(0.8,1.2)*1000)/1000};}
function fixWeaponItems(){for(const it of save.inv||[])if(it.slot==='weapon'&&it.g==null){it.g=Math.min(4,it.rar|0);it.p=0;it.opt=it.opt||null;}}
/* 해금된 직업마다 '기본 무기'를 인벤토리에 보장 — 기존 대장간 강화 단계(save.weapons)를 그대로 옮겨 옴 */
function ensureBaseWeapons(){
 if(!save.inv)save.inv=[];if(!save.equip)save.equip={};let add=false;
 for(const k of Object.keys(CLASSES)){
  const want=k==='novice'?!save.jobDone:!!save.unlocked[k];if(!want)continue;
  let it=baseWeapon(k);
  if(!it){const L=(save.weapons&&save.weapons[k])||{g:0,p:0,opt:null};
   it={uid:newUid(),slot:'weapon',cls:k,base:true,name:CLASSES[k].wname,icon:CLASSES[k].icon,rar:L.g|0,g:L.g|0,p:L.p|0,opt:L.opt||null,st:{},w:BASE_W[k]||3,heavy:null,price:0};
   save.inv.unshift(it);add=true;}
  const eq=save.equip[k]||(save.equip[k]={});if(!eq.weapon||!itemById(eq.weapon)){eq.weapon=it.uid;add=true;}
 }

function wOpt(k){const it=equippedWeaponOf(save.cls),o=it&&it.opt;return o&&o.k===k?o.v:0;}

const _userBalanceHurtCap=hurtPlayer;
hurtPlayer=function(dmg,src){
 // 보스의 일반 공격 및 적 투사체 피해를 12배 강화하되, 기존 기준 최대 피해 상한은 유지한다.
 const bossHit=!!(src&&(src.boss||src.B||(src.isProj&&!src.friend)));
 if(bossHit&&P&&!P.dead&&Number.isFinite(dmg)){
  dmg*=12;
  const rawCap=Math.round((P.maxHp*0.60)/0.67);
  dmg=Math.min(dmg,rawCap);
 }
 return _userBalanceHurtCap(dmg,src);
};

function v26EnsureInventoryState(){
  if(!Array.isArray(save.inv))save.inv=[];
  if(!save.equip||typeof save.equip!=='object')save.equip={};
  if(!save.redeemedCodes||typeof save.redeemedCodes!=='object')save.redeemedCodes={};

function v26ReconcileSavedXp(){
  v26EnsureInventoryState();
  let gained=0;
  while(gained<100&&Number(save.xp||0)>=eternalNeedXp(save.level)){
    save.xp-=eternalNeedXp(save.level);
    save.level=Math.max(1,Number(save.level)||1)+1;
    save.sp=(save.sp||0)+3;
    gained++;
  }
  if(gained){
    writeSave(true);
    toast(`📈 성장 곡선 안정화 보정: 레벨 ${gained} 상승 · 스탯 포인트 +${gained*3}`);

}

function useXpTicket(uid){
  v26EnsureInventoryState();

/* ===================== v26 · LEVEL CAP 100 + INVENTORY HARDENING =====================
   기존 v25.1 인벤토리/보관함/장비 기능을 유지하고 레벨 상한을 최종 단계에서 강제한다.
*/
const V26_MAX_LEVEL=100;
function v26ApplyLevelCap(){
  const lv=Math.max(1,Math.floor(Number(save.level)||1));
  save.level=Math.min(V26_MAX_LEVEL,lv);
  if(save.level>=V26_MAX_LEVEL){
    // 100레벨 이후 경험치는 누적하지 않는다. 이미 저장된 초과 경험치도 정리한다.
    save.xp=0;
  }else{
    save.xp=Math.max(0,Math.floor(Number(save.xp)||0));
  }
  save.sp=Math.max(0,Math.floor(Number(save.sp)||0));
}

// 저장 데이터 로드 직후에도 100레벨 상한을 적용한다.
const _v26LoadSaveLevelCap=loadSave;
loadSave=function(){
  const loaded=_v26LoadSaveLevelCap();
  v26ApplyLevelCap();
  return loaded;
};

// 이전 버전의 경험치 배율·레벨업 연출을 보존하면서 최종 레벨만 100으로 제한한다.
const _v26GainXpLevelCap=gainXp;
gainXp=function(n){
  v26ApplyLevelCap();
  if(save.level>=V26_MAX_LEVEL){save.xp=0;return;}
  n=Math.max(0,Math.round(Number(n)||0));
  if(G.g2k)n*=killXpMul(G.g2k);
  if(run&&run.mode==='region'&&run.hard){
    const tier=Math.max(1,Math.min(3,Number(run.v25Tier)||1));
    n*=tier===1?1.5:(tier===2?1.6:1.7);
  }
  n=Math.round(n);
  if(n<=0)return;
  save.xp=(save.xp||0)+n;
  if(run)run.xp=(run.xp||0)+n;
  let levels=0;
  while(save.level<V26_MAX_LEVEL&&save.xp>=eternalNeedXp(save.level)){
    save.xp-=eternalNeedXp(save.level);
    save.level++;
    save.sp=(save.sp||0)+3;
    levels++;
    sfx('level');
    if(P&&!P.dead){
      P.hp=Math.min(P.maxHp,P.hp+P.maxHp*0.25);
      addFx({kind:'text',x:cxOf(P),y:P.y-40,txt:'LEVEL UP!',col:'#ffd77a',life:70});
    }
    if(save.level===5&&!save.jobDone)addFx({kind:'banner',txt:'🎖️ 전직 가능 — 거점의 [전직] 메뉴에서 직업을 고르세요',col:'#ffd77a',life:160});
    if(save.level===15&&save.jobDone)addFx({kind:'banner',txt:'🏯 유파 개방 — [캐릭터 · 유파]에서 유파를 고르세요',col:'#ffd77a',life:160});
    if(save.level===30)addFx({kind:'banner',txt:'⚔ 아르디아 탐색 HARD I 개방!',col:'#ff9b65',life:150});
    if(save.level===40)addFx({kind:'banner',txt:'🔥 아르디아 탐색 HARD II 개방!',col:'#ff765e',life:150});
    if(save.level===50)addFx({kind:'banner',txt:'☠ 아르디아 탐색 HARD III 개방!',col:'#d78cff',life:150});
    if(save.level===60)addFx({kind:'banner',txt:'🏛 엔드게임 개방 — 레이드 · 고대 던전',col:'#7fe0ff',life:170});
  }
  if(levels)toast(`⬆️ 레벨 ${save.level} 달성! 스탯 포인트 +${levels*3}`);
  if(save.level>=V26_MAX_LEVEL){
    save.level=V26_MAX_LEVEL;

const V27_MATE_MAX_LEVEL=100;
function v27NormalizeMateLevels(){
  let changed=false;
  if(!save.comp||typeof save.comp!=='object')return changed;
  for(const k of Object.keys(MATES)){
    const c=save.comp[k];
    if(!c)continue;
    const floor=Math.max(1,Number(mateFloor(k))||1);
    const lv=Math.max(floor,Math.min(V27_MATE_MAX_LEVEL,Math.floor(Number(c.lv)||1)));
    if(c.lv!==lv){c.lv=lv;changed=true;}
    if(lv>=V27_MATE_MAX_LEVEL&&Number(c.exp)!==0){c.exp=0;changed=true;}
    else if(!Number.isFinite(Number(c.exp))||Number(c.exp)<0){c.exp=0;changed=true;}
  }
  if(changed)writeSave(true);
  return changed;
}

// v22의 성장 연출·호감도 보상·자동 승급은 유지하되 Lv.100에서 경험치 누적을 종료한다.
mateGainXp=function(k,n){
  const c=save.comp&&save.comp[k];
  if(!c||!Number.isFinite(Number(n))||n<=0||k==='belka')return;
  v27NormalizeMateLevels();
  c.lv=Math.max(mateFloor(k),Math.min(V27_MATE_MAX_LEVEL,Math.floor(Number(c.lv)||1)));
  if(c.lv>=V27_MATE_MAX_LEVEL){c.exp=0;return;}
  c.exp=Math.max(0,Number(c.exp)||0)+n;
  while(c.lv<V27_MATE_MAX_LEVEL&&c.exp>=v22MateNeed(c.lv)){
    c.exp-=v22MateNeed(c.lv);
    c.lv++;
    const m=mates.find(x=>x.k===k),D=MATES[k];
    if(m){m.hp=m.maxHp;addFx({kind:'text',x:cxOf(m),y:m.y-36,txt:`${D.name} Lv.${c.lv}!`,col:D.col,life:60});}
    toast(`🤝 ${D.name} 레벨 ${c.lv}!`);sfx('level');
    if(c.lv%10===0){evPush(`ml_${k}_${c.lv}`);addAff(k,10);}
    matePromoteCheck(k);
  }
  if(c.lv>=V27_MATE_MAX_LEVEL){c.lv=V27_MATE_MAX_LEVEL;c.exp=0;toast(`🏆 ${MATES[k].name} 최고 레벨 달성 · Lv.100`);}
};

// 1) 배경: 테마별 별빛/먼지/원경 실루엣을 저해상도 픽셀 단위로 추가

    const y=22+((i*67+Math.floor(V28_PIXEL_SEED(i)*190))%300);

    if((i%3)!==0||tw>0.78){v28Pixel(x,y,i%9===0?3:2,i%11===0?3:2,palette[i%palette.length],0.18+tw*0.38);}
  }
  // 멀리 보이는 작은 창문과 등불: 화면 가장자리의 원경 레이어
  for(let i=0;i<18;i++){

const _fixDefaultSaveInventory = defaultSave;
defaultSave = function(){
  const d = _fixDefaultSaveInventory();
  if(!Array.isArray(d.inv)) d.inv=[];
  if(!Array.isArray(d.storage)) d.storage=[];
  if(!d.equip || typeof d.equip!=='object') d.equip={};
  d.developerUnlocked=false;
  return d;
};
function fixInventoryState(){
  if(!save || typeof save!=='object') save=defaultSave();
  if(!Array.isArray(save.inv)) save.inv=[];
  if(!Array.isArray(save.storage)) save.storage=[];
  if(!save.equip || typeof save.equip!=='object') save.equip={};
  if(typeof save.developerUnlocked!=='boolean') save.developerUnlocked=false;
  const seen=new Set();
  for(const list of [save.inv,save.storage]){
    for(const it of list){
      if(!it || typeof it!=='object') continue;
      if(it.rar==null || !Number.isFinite(Number(it.rar))) it.rar=0;
      it.rar=clamp(Math.floor(Number(it.rar)),0,Math.max(0,IR.length-1));
      if(!it.st || typeof it.st!=='object') it.st={};
      if(it.uid==null || it.uid==='' || seen.has(String(it.uid))){
        it.uid=newUid();
      }
      seen.add(String(it.uid));
    }
  }
}
function fixItemLines(it){
  try{
    if(it.cls && !CLASSES[it.cls]) it.cls=null;
    return itemLines(it);
  }catch(e){
    return `${it.description||'아이템 효과 정보 없음'}<br>무게 ${Number(it.w)||0}`;

}

  }).join('')||`<div class="card muted" style="grid-column:1/-1;text-align:center;padding:24px">${v26InventoryTab==='consumable'?'보유한 소비 아이템이 없습니다.':'인벤토리가 비어 있습니다.'}</div>`;
  const tabButton=(key,label)=>`<button class="btn sm ${v26InventoryTab===key?'gold':''}" onclick="showInventory('${key}')">${label}</button>`;
  setUI(`<div class="scr"><div class="hdr"><h2>🎒 인벤토리</h2><div class="row" style="gap:6px"><span class="muted">${inv.length}/${INV_MAX}</span><button class="btn sm" onclick="showStorage()">🗄️ 보관함</button><button class="btn" onclick="showHub()">← 거점</button></div></div><div class="row" style="gap:5px;flex-wrap:wrap;margin-bottom:8px">${tabButton('all',`전체 ${inv.length}`)}${tabButton('gear',`장비 ${inv.filter(x=>!isConsumable(x)).length}`)}${tabButton('consumable',`소비 아이템 ${inv.filter(isConsumable).length}`)}<button class="btn sm" onclick="showEquip()">⚔️ 장비 장착/판매</button></div><div class="scroll" style="flex:1;min-height:0"><div class="grid3">${cards}</div></div><div class="muted sm" style="margin-top:6px">장비를 장착하거나 판매할 수 있으며, 보관함으로 옮겨 가방 공간을 확보할 수 있습니다.</div></div>`);
}
function equipItem(uid){
  fixInventoryState();
  const it=itemById(uid);
  if(!it){toast('가방에 있는 장비만 장착할 수 있습니다.');return;}
  if(it.itemType||it.type==='consumable'){toast('소비 아이템은 장착할 수 없습니다.');return;}
  if(it.cls&&it.cls!==save.cls){toast('현재 직업으로 장착할 수 없는 장비입니다.');return;}
  if(!SLOTS.some(([slot])=>slot===it.slot)){toast('장비 슬롯 정보가 올바르지 않습니다.');return;}
  (save.equip[save.cls]||(save.equip[save.cls]={}))[it.slot]=it.uid;
  writeSave(true);sfx('select');keepScroll(()=>showEquip());
}
function unequip(slot){
  fixInventoryState();
  const eq=save.equip[save.cls];
  if(eq&&eq[slot]!=null)delete eq[slot];
  writeSave(true);sfx('select');keepScroll(()=>showEquip());
}

</script>
</body>
</html>
